services:
  mysql84:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: doka_provider
      MYSQL_USER: doka
      MYSQL_PASSWORD: doka_password
    ports:
      - "127.0.0.1:${DOKA_MYSQL84_PORT:-33068}:3306"
    volumes:
      - doka-mysql84-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql97:
