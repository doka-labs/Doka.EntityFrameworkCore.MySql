      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: doka_provider
      MYSQL_USER: doka
      MYSQL_PASSWORD: doka_password
    ports:
      - "127.0.0.1:${DOKA_MYSQL97_PORT:-33070}:3306"
    volumes:
