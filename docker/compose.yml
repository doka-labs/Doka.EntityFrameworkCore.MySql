services:
  mysql84:
    image: mysql:26.7.0@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: doka_provider
      MYSQL_USER: doka
      MYSQL_PASSWORD: doka_password
    ports:
      - "127.0.0.1:${DOKA_MYSQL84_PORT:-33068}:3306"
    volumes:
      - doka-mysql84-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mariadb118:
    image: mariadb:12.3.2@sha256:759869cb6f003234a95c6384cdee245b4bce7de26913fe607a8110362c0c007d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: doka_provider
      MARIADB_USER: doka
      MARIADB_PASSWORD: doka_password
    ports:
      - "127.0.0.1:${DOKA_MARIADB118_PORT:-33069}:3306"
    volumes:
      - doka-mariadb118-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mariadb114:
    image: mariadb:12.3.2@sha256:759869cb6f003234a95c6384cdee245b4bce7de26913fe607a8110362c0c007d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: doka_provider
      MARIADB_USER: doka
      MARIADB_PASSWORD: doka_password
    ports:
      - "127.0.0.1:${DOKA_MARIADB114_PORT:-33067}:3306"
    volumes:
      - doka-mariadb114-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  doka-mysql84-data:
  doka-mariadb118-data:
  doka-mariadb114-data:
