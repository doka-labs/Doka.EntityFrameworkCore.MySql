version: 2
updates:
  # Frozen bootstrap input keeps historical scenarios independent of activation.
  - package-ecosystem: docker-compose
    directories:
      - /docker
    schedule:
      interval: monthly
    groups:
      database-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: mysql
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: mariadb
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: MySqlConnector
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
