version: 2
updates:
  # The workflow service containers and the Compose stack are digest-pinned,
  # so a published engine security fix never reaches this repository unless
  # something proposes the new digest. github-actions updates do not cover
  # container images, which is why this ecosystem is declared separately.
  - package-ecosystem: docker
    directories:
      - /
      - /docker
      - /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      database-images:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions

  # global.json is the immutable build and publication toolchain contract.
  # SDK changes therefore arrive as reviewable pull requests and must pass the
  # same exact-version, release-evidence, and repository gates as source edits.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - dotnet-sdk

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      # Microsoft.EntityFrameworkCore.* floats inside the [10.0.8, 10.1.0) range
      # per ADR D-009. The scheduled floor/latest matrix owns patch validation,
      # while a deliberate provider response is required for 10.1.0+.
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # MySqlConnector 2.5.0 is the supported package floor. The scheduled
      # minimum/latest matrix owns 2.x patch validation and raises the floor
      # only when the provider consumes a newer driver contract. A future
      # major remains visible because it requires an explicit compatibility
      # decision rather than silent suppression.
      - dependency-name: MySqlConnector
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - nuget
