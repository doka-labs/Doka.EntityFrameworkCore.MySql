version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      runtime-dependencies:
        patterns:
          - "MySqlConnector"
          - "NetTopologySuite"
          - "System.IO.Hashing"
      example-dependencies:
        patterns:
          - "Microsoft.Extensions.*"
          - "OpenTelemetry.*"
          - "Serilog.*"
      test-infrastructure:
        patterns:
          - "BenchmarkDotNet"
          - "FsCheck.*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers.*"
          - "coverlet.*"
          - "xunit*"
    ignore:
      # Microsoft.EntityFrameworkCore.* floats inside the [10.0.8, 10.1.0) range
      # per ADR D-009. The scheduled floor/latest matrix owns patch validation,
      # while a deliberate provider response is required for 10.1.0+.
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - nuget
