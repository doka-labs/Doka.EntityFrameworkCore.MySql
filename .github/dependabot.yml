version: 2
updates:
  # The engine images are digest-pinned, so a published security fix reaches
  # this repository only if something proposes the new digest. Compose files
  # need the docker-compose ecosystem; the docker ecosystem reads Dockerfiles,
  # of which this repository has none, and no ecosystem updates the container
  # images referenced inside workflow files.
  #
  # The Compose stack is therefore the one place an update lands, and it is the
  # source the other copies are held against. A proposal that changes it leaves
  # the workflows, the performance contract, and the C# constants behind until
  # eng/quality/check-image-pins.py --fix carries it over; the same check fails
  # the build while they disagree.
  - package-ecosystem: docker-compose
    directories:
      - /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      database-images:
        patterns:
          - "*"
    ignore:
      # The provider supports MySQL 8.4 LTS and MariaDB 11.4 / 11.8 LTS, and
      # the specification suites, the performance contract, and the accepted
      # baseline are all calibrated to those lines. Proposals follow the
      # highest published version, which is a different series entirely, so
      # only patches within a supported line are wanted here. Moving to
      # another line is a provider decision with its own matrix and baseline
      # work, not something an update proposal can carry.
      - dependency-name: mysql
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: mariadb
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions

  # global.json is the immutable build and publication toolchain contract.
  # SDK changes therefore arrive as reviewable pull requests and must pass the
  # same exact-version, release-evidence, and repository gates as source edits.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - dotnet-sdk

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      # Microsoft.EntityFrameworkCore.* floats inside the [10.0.8, 10.1.0) range
      # per ADR D-009. The scheduled floor/latest matrix owns patch validation,
      # while a deliberate provider response is required for 10.1.0+.
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # MySqlConnector 2.5.0 is the supported package floor. The scheduled
      # minimum/latest matrix owns 2.x patch validation and raises the floor
      # only when the provider consumes a newer driver contract. A future
      # major remains visible because it requires an explicit compatibility
      # decision rather than silent suppression.
      - dependency-name: MySqlConnector
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - nuget
