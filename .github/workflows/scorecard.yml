name: scorecard

# Publishes an independent supply-chain assessment of this repository. The
# score is produced by OpenSSF from observable repository state, not from the
# project's own claims, which is what makes it usable as external evidence for
# the release and publication posture described in the security documentation.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1"

permissions:
  contents: read

concurrency:
  # Only the latest default-branch state is publishable evidence. A newer
  # revision therefore supersedes an older scan that has not completed yet.
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    permissions:
      # Uploads the SARIF result into the repository code-scanning surface.
      security-events: write
      # Required by publish_results so OpenSSF can verify the result came from
      # this workflow in this repository rather than from an arbitrary caller.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Retained independently of the code-scanning upload so a failed or
      # rate-limited upload still leaves the reviewed evidence available.
      - name: Upload result artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Upload result to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
