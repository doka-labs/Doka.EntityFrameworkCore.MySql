name: benchmark

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baseline_mode:
        description: "Use auto for comparison; seed is reviewed recalibration."
        required: true
        default: auto
        type: choice
        options:
          - auto
          - seed
  schedule:
    # One unattended refresh per month detects hosted-runner drift without
    # consuming the GitHub Free allowance on four equivalent weekly runs.
    - cron: "15 2 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every main push reaches the cheap resolver. Do not let an unrelated push
  # cancel scorecard evidence that a schedule, manual run, or relevant change
  # already started producing.
  cancel-in-progress: false

jobs:
  resolve-baseline-mode:
    name: Resolve baseline mode
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      contract-version: ${{ steps.resolve.outputs.contract-version }}
      mode: ${{ steps.resolve.outputs.mode }}
      baseline-branch: ${{ steps.resolve.outputs.baseline-branch }}
      scorecard-required: ${{ steps.resolve.outputs.scorecard-required }}
      sync-required: ${{ steps.resolve.outputs.sync-required }}
      proposal-required: ${{ steps.resolve.outputs.proposal-required }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The resolver is the workflow's cheap control plane. It validates any
      # open proposal and inspects its exact evidence commit before allocating
      # service containers or either benchmark runner.
      - name: Resolve benchmark work
        id: resolve
        env:
          BEFORE_REVISION: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MODE: ${{ inputs.baseline_mode || 'auto' }}
        run: |
          mkdir -p artifacts

          contract_version="$(
            jq -er '
              .contractVersion
              | select(
                  type == "string"
                  and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")
                )
            ' benchmarks/performance-contract.json
          )"

          python3 -m eng.performance.cli resolve-baseline-mode \
            --contract benchmarks/performance-contract.json \
            --baseline benchmarks/baselines/doka-benchmark-baseline.json \
            --profile scorecard \
            --runner-class github-ubuntu-latest-x64 \
            --requested-mode "${REQUESTED_MODE}" \
            --output artifacts/baseline-mode.json

          mode="$(jq -er '.mode' artifacts/baseline-mode.json)"
          baseline_branch="automation/performance-baseline-${contract_version}"
          proposal_number=""
          state_arguments=(
            --repo "${GITHUB_WORKSPACE}"
            --event-name "${EVENT_NAME}"
            --current-revision "${GITHUB_SHA}"
            --baseline-mode "${mode}"
            --contract benchmarks/performance-contract.json
            --profile scorecard
            --runner-class github-ubuntu-latest-x64
            --output artifacts/benchmark-workflow-state.json
          )

          if [[ -n "${BEFORE_REVISION}" ]]; then
            state_arguments+=(--before-revision "${BEFORE_REVISION}")
          fi

          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Hosted performance evidence must originate from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          # Comparison mode never reads or mutates proposal state. Proposal
          # maintenance belongs exclusively to reviewed seed recalibration.
          if [[ "${mode}" == "seed" ]]; then
            proposal_number="$(
              gh pr list \
                --repo "${GITHUB_REPOSITORY}" \
                --state open \
                --head "${baseline_branch}" \
                --json number \
                --jq '.[0].number // empty'
            )"
          fi

          if [[ "${mode}" == "seed" && -n "${proposal_number}" ]]; then
            baseline_path="benchmarks/baselines/doka-benchmark-baseline.json"
            proposed_baseline="artifacts/proposed-baseline.json"

            git fetch \
              --no-tags \
              origin \
              "${baseline_branch}:refs/remotes/origin/${baseline_branch}"

            proposal_base="$(
              git merge-base \
                "${GITHUB_SHA}" \
                "origin/${baseline_branch}"
            )"
            while IFS= read -r changed_path; do
              if [[ "${changed_path}" != "${baseline_path}" ]]; then
                echo "Refusing to inspect unexpected proposal path: ${changed_path}" >&2
                exit 1
              fi
            done < <(
              git diff \
                --name-only \
                --diff-filter=ACDMRTUXB \
                "${proposal_base}" \
                "origin/${baseline_branch}" \
                --
            )

            # A missing baseline is invalid proposal evidence, not an
            # unhandled shell error. The Python resolver classifies the
            # empty file as invalid. Proposal health alone cannot allocate
            # scorecard work; a relevant event can replace the proposal.
            if ! git show \
              "origin/${baseline_branch}:${baseline_path}" \
              > "${proposed_baseline}"; then
              : > "${proposed_baseline}"
            fi

            state_arguments+=(
              --proposed-baseline "${proposed_baseline}"
              --proposal-head-ref "origin/${baseline_branch}"
            )
          fi

          python3 -m eng.performance.workflow_state "${state_arguments[@]}"

          {
            echo "contract-version=${contract_version}"
            echo "mode=${mode}"
            echo "baseline-branch=${baseline_branch}"
            echo "scorecard-required=$(jq -er '.scorecardRequired' artifacts/benchmark-workflow-state.json)"
            echo "sync-required=$(jq -er '.syncRequired' artifacts/benchmark-workflow-state.json)"
            echo "proposal-required=$(jq -er '.proposalRequired' artifacts/benchmark-workflow-state.json)"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Benchmark workflow decision"
            echo
            echo "- Requested: $(jq -r '.requestedMode' artifacts/baseline-mode.json)"
            echo "- Selected: ${mode}"
            echo "- Baseline: $(jq -r '.baselineDisposition' artifacts/baseline-mode.json)"
            echo "- Proposal: $(jq -r '.proposal.disposition' artifacts/benchmark-workflow-state.json)"
            echo "- Scorecard required: $(jq -r '.scorecardRequired' artifacts/benchmark-workflow-state.json)"
            echo "- Proposal sync required: $(jq -r '.syncRequired' artifacts/benchmark-workflow-state.json)"
            echo "- Proposal write required: $(jq -r '.proposalRequired' artifacts/benchmark-workflow-state.json)"
          } >> "${GITHUB_STEP_SUMMARY}"

  sync-baseline-proposal:
    if: needs.resolve-baseline-mode.outputs.sync-required == 'true'
    needs: resolve-baseline-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write
      contents: write

    steps:
      # This job pushes the reviewed baseline branch, so the checkout token
      # must stay available to Git. What bounds that credential is the trigger
      # and the permission set: the workflow runs only from the default branch
      # and never on fork input, and the job requests contents plus actions
      # write and nothing else. The tree-diff guard below is content control on
      # top of that, not the boundary itself.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # An unrelated main change must not spend another scorecard run merely to
      # make the existing proposal mergeable. The tree-diff guard proves that
      # the automation branch still changes only the reviewed baseline file.
      - name: Synchronize current proposal with main
        env:
          BASELINE_BRANCH: ${{ needs.resolve-baseline-mode.outputs.baseline-branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_path="benchmarks/baselines/doka-benchmark-baseline.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch \
            --no-tags \
            origin \
            "${BASELINE_BRANCH}:refs/remotes/origin/${BASELINE_BRANCH}"
          git switch \
            --create "${BASELINE_BRANCH}" \
            --track "origin/${BASELINE_BRANCH}"
          git merge --no-edit "${GITHUB_SHA}"

          while IFS= read -r changed_path; do
            if [[ "${changed_path}" != "${baseline_path}" ]]; then
              echo "Refusing to synchronize unexpected proposal path: ${changed_path}" >&2
              exit 1
            fi
          done < <(git diff --name-only "${GITHUB_SHA}" HEAD)

          python3 -m eng.performance.cli validate-baseline \
            --contract benchmarks/performance-contract.json \
            --baseline "${baseline_path}" \
            --output artifacts/baseline-validation.json
          git push origin "HEAD:refs/heads/${BASELINE_BRANCH}"

          # Pushes made with GITHUB_TOKEN do not start another workflow. Use a
          # bounded trusted dispatch so the required checks bind to this exact
          # proposal head without enabling the expensive CI profile.
          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BASELINE_BRANCH}" \
            --field profile=baseline-proposal

          {
            echo "## Baseline proposal synchronized"
            echo
            echo "- Branch: ${BASELINE_BRANCH}"
            echo "- Scorecard rerun: not required"
            echo "- Pull-request checks: queued for the updated proposal head"
          } >> "${GITHUB_STEP_SUMMARY}"

  benchmark-scorecard:
    if: needs.resolve-baseline-mode.outputs.scorecard-required == 'true'
    needs: resolve-baseline-mode
    uses: ./.github/workflows/benchmark-scorecard.yml
    with:
      baseline_mode: ${{ needs.resolve-baseline-mode.outputs.mode }}
    permissions:
      contents: read
      actions: read

  propose-baseline-update:
    if: needs.resolve-baseline-mode.outputs.proposal-required == 'true'
    needs:
      - resolve-baseline-mode
      - benchmark-scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      # This job pushes the proposal branch and opens its pull request, so the
      # checkout token must stay available to Git. The trigger and the
      # permission set bound that credential; the branch ruleset decides
      # whether the resulting pull request can merge. The three tree-diff
      # guards below constrain what may be committed, which is damage control
      # rather than the boundary.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Download MySQL evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-artifacts-mysql84
          path: artifacts/benchmarks/mysql84

      - name: Download MariaDB evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-artifacts-mariadb118
          path: artifacts/benchmarks/mariadb118

      - name: Build combined baseline candidate
        id: candidate
        env:
          BASELINE_VERSION: github-${{ github.run_id }}
        run: |
          mapfile -t mysql_evidence < <(
            find artifacts/benchmarks/mysql84 \
              -type f \
              -name performance-evaluation.json
          )
          mapfile -t mariadb_evidence < <(
            find artifacts/benchmarks/mariadb118 \
              -type f \
              -name performance-evaluation.json
          )

          if [[ "${#mysql_evidence[@]}" -ne 1 || "${#mariadb_evidence[@]}" -ne 1 ]]; then
            echo "Expected exactly one evaluation for each benchmark target." >&2
            exit 1
          fi

          python3 -m eng.performance.cli seed \
            --contract benchmarks/performance-contract.json \
            --baseline artifacts/doka-benchmark-baseline.candidate.json \
            --version "${BASELINE_VERSION}" \
            --merge-existing benchmarks/baselines/doka-benchmark-baseline.json \
            --evidence "${mysql_evidence[0]}" \
            --evidence "${mariadb_evidence[0]}"

          python3 -m eng.performance.cli validate-baseline \
            --contract benchmarks/performance-contract.json \
            --baseline artifacts/doka-benchmark-baseline.candidate.json \
            --output artifacts/baseline-validation.json

          python3 -m eng.performance.cli compare-baselines \
            --contract benchmarks/performance-contract.json \
            --current benchmarks/baselines/doka-benchmark-baseline.json \
            --candidate artifacts/doka-benchmark-baseline.candidate.json \
            --output artifacts/baseline-comparison.json

          echo "baseline-changed=$(jq -er '.changed' artifacts/baseline-comparison.json)" >> "${GITHUB_OUTPUT}"

      # Preserve the complete review input even though the normal maintainer
      # path is the pull-request diff rather than a downloaded artifact.
      - name: Upload baseline review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-baseline-review-evidence
          path: |
            artifacts/doka-benchmark-baseline.candidate.json
            artifacts/baseline-comparison.json
            artifacts/baseline-validation.json

      - name: Report unchanged accepted baseline
        if: steps.candidate.outputs.baseline-changed != 'true'
        run: |
          {
            echo "## Baseline proposal"
            echo
            echo "Seed evidence changed provenance only."
            echo "The accepted performance contract is unchanged, so no branch or pull request was created."
          } >> "${GITHUB_STEP_SUMMARY}"

      # The proposal is written by a trusted workflow and then receives a
      # bounded CI dispatch for its exact head. The dispatch executes only the
      # three cheap required checks; it never approves or merges the proposal.
      - name: Propose reviewed baseline update
        if: steps.candidate.outputs.baseline-changed == 'true'
        env:
          BASELINE_BRANCH: ${{ needs.resolve-baseline-mode.outputs.baseline-branch }}
          CONTRACT_VERSION: ${{ needs.resolve-baseline-mode.outputs.contract-version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_path="benchmarks/baselines/doka-benchmark-baseline.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote \
            --exit-code \
            --heads origin \
            "refs/heads/${BASELINE_BRANCH}" > /dev/null 2>&1; then
            git fetch \
              --no-tags \
              origin \
              "${BASELINE_BRANCH}:refs/remotes/origin/${BASELINE_BRANCH}"
            git switch \
              --create "${BASELINE_BRANCH}" \
              --track "origin/${BASELINE_BRANCH}"
            git merge --no-edit "${GITHUB_SHA}"
          else
            git switch --create "${BASELINE_BRANCH}" "${GITHUB_SHA}"
          fi

          while IFS= read -r changed_path; do
            if [[ "${changed_path}" != "${baseline_path}" ]]; then
              echo "Refusing to update unexpected proposal path: ${changed_path}" >&2
              exit 1
            fi
          done < <(git diff --name-only "${GITHUB_SHA}" HEAD)

          install \
            -m 0644 \
            artifacts/doka-benchmark-baseline.candidate.json \
            "${baseline_path}"

          while IFS= read -r changed_path; do
            if [[ "${changed_path}" != "${baseline_path}" ]]; then
              echo "Refusing to commit unexpected proposal path: ${changed_path}" >&2
              exit 1
            fi
          done < <(git diff --name-only "${GITHUB_SHA}")

          python3 -m eng.performance.cli validate-baseline \
            --contract benchmarks/performance-contract.json \
            --baseline "${baseline_path}" \
            --output artifacts/baseline-validation.json

          git add "${baseline_path}"
          if ! git diff --cached --quiet; then
            commit_message="${RUNNER_TEMP}/performance-baseline-commit.txt"
            {
              echo "perf(benchmarks): refresh hosted performance baseline"
              echo
              echo "- Keep strict hosted comparison aligned with the active contract."
              echo "- Accept the validated MySQL and MariaDB scorecard evidence."
            } > "${commit_message}"
            git commit --file "${commit_message}"
          fi

          git push \
            --set-upstream origin \
            "HEAD:refs/heads/${BASELINE_BRANCH}"

          proposal_body="${RUNNER_TEMP}/performance-baseline-pr.md"
          # The single-quoted printf formats carry literal Markdown backticks;
          # every value is passed as an argument rather than interpolated.
          # shellcheck disable=SC2016
          {
            echo "This pull request proposes the validated hosted baseline for the active performance contract."
            echo
            printf -- '- Contract version: `%s`\n' "${CONTRACT_VERSION}"
            printf -- '- Source commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Evidence run: [benchmark %s](%s/%s/actions/runs/%s)\n' \
              "${GITHUB_RUN_ID}" \
              "${GITHUB_SERVER_URL}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_RUN_ID}"
            echo
            echo "The workflow validated the complete MySQL 8.4 and MariaDB 11.8 scorecard pair before opening this review."
            echo "The workflow never approves its own pull request."
            echo "Squash auto-merge remains blocked until a maintainer approves the current revision and every required check passes."
            echo
            echo "The workflow explicitly dispatches the three required repository checks for the exact proposal head."
            echo "Review the baseline diff and approve the pull request; no workflow approval or artifact download is required."
          } > "${proposal_body}"

          proposal_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --head "${BASELINE_BRANCH}" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${proposal_number}" ]]; then
            proposal_update="${RUNNER_TEMP}/performance-baseline-pr.json"
            jq -n \
              --arg title "perf(benchmarks): refresh hosted performance baseline" \
              --rawfile body "${proposal_body}" \
              '{title: $title, body: $body}' \
              > "${proposal_update}"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${proposal_number}" \
              --input "${proposal_update}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${DEFAULT_BRANCH}" \
              --head "${BASELINE_BRANCH}" \
              --title "perf(benchmarks): refresh hosted performance baseline" \
              --body-file "${proposal_body}"

            proposal_number="$(
              gh pr list \
                --repo "${GITHUB_REPOSITORY}" \
                --state open \
                --head "${BASELINE_BRANCH}" \
                --json number \
                --jq '.[0].number // empty'
            )"
          fi

          if [[ -z "${proposal_number}" ]]; then
            echo "The baseline proposal pull request could not be resolved." >&2
            exit 1
          fi

          # GITHUB_TOKEN branch updates intentionally do not trigger another
          # workflow. Dispatch the restricted profile only after the proposal
          # exists so its required checks attach to the reviewed head.
          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BASELINE_BRANCH}" \
            --field profile=baseline-proposal

          auto_merge_method="$(
            gh pr view \
              --repo "${GITHUB_REPOSITORY}" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest.mergeMethod // empty' \
              "${proposal_number}"
          )"

          if [[ -n "${auto_merge_method}" && "${auto_merge_method}" != "SQUASH" ]]; then
            echo "Refusing to replace unexpected ${auto_merge_method} auto-merge policy." >&2
            exit 1
          fi

          if [[ -z "${auto_merge_method}" ]]; then
            # Auto-merge schedules the protected merge; it does not approve the
            # proposal or bypass the required review and status checks.
            gh pr merge \
              --repo "${GITHUB_REPOSITORY}" \
              --auto \
              --squash \
              --match-head-commit "$(git rev-parse HEAD)" \
              "${proposal_number}"
          fi

          {
            echo "## Baseline review proposed"
            echo
            echo "- Branch: ${BASELINE_BRANCH}"
            echo "- Pull-request checks: explicitly dispatched for the proposal head"
            echo "- Auto-merge: enabled (squash)"
            echo "- Acceptance: maintainer approval and protected checks"
          } >> "${GITHUB_STEP_SUMMARY}"
