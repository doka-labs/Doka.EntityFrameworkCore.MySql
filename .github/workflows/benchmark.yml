name: benchmark

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baseline_mode:
        description: "Use auto for comparison; seed is reviewed recalibration."
        required: true
        default: auto
        type: choice
        options:
          - auto
          - seed
  schedule:
    # One unattended refresh per month detects hosted-runner drift without
    # consuming the GitHub Free allowance on four equivalent weekly runs.
    - cron: "15 2 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every main push reaches the cheap resolver. Do not let an unrelated push
  # cancel scorecard evidence that a schedule, manual run, or relevant change
  # already started producing.
  cancel-in-progress: false

jobs:
  resolve-baseline-mode:
    name: Resolve baseline mode
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      contract-version: ${{ steps.resolve.outputs.contract-version }}
      mode: ${{ steps.resolve.outputs.mode }}
      baseline-branch: ${{ steps.resolve.outputs.baseline-branch }}
      comparison-mode: ${{ steps.resolve.outputs.comparison-mode }}
      measurement-tier: ${{ steps.resolve.outputs.measurement-tier }}
      sync-required: ${{ steps.resolve.outputs.sync-required }}
      proposal-required: ${{ steps.resolve.outputs.proposal-required }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The resolver is the workflow's cheap control plane. It validates any
      # open proposal and inspects its exact evidence commit before allocating
      # service containers or either benchmark runner.
      - name: Resolve benchmark work
        id: resolve
        env:
          BEFORE_REVISION: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MODE: ${{ inputs.baseline_mode || 'auto' }}
        run: |
          mkdir -p artifacts

          # The resolver validates the contract, including the format of its
          # version, so the version is read back from its output rather than
          # matched again here. A second pattern in this step would be a
          # separate contract that can disagree with the first one silently,
          # and it would reject the file before the resolver ever sees it.
          python3 -m eng.performance.cli resolve-baseline-mode \
            --contract benchmarks/performance-contract.json \
            --baseline benchmarks/baselines/doka-benchmark-baseline.json \
            --profile scorecard \
            --runner-class github-ubuntu-latest-x64 \
            --requested-mode "${REQUESTED_MODE}" \
            --output artifacts/baseline-mode.json

          contract_version="$(jq -er '.contractVersion' artifacts/baseline-mode.json)"
          mode="$(jq -er '.mode' artifacts/baseline-mode.json)"
          baseline_branch="automation/performance-baseline-${contract_version}"
          proposal_number=""
          state_arguments=(
            --repo "${GITHUB_WORKSPACE}"
            --event-name "${EVENT_NAME}"
            --current-revision "${GITHUB_SHA}"
            --baseline-mode "${mode}"
            --contract benchmarks/performance-contract.json
            --profile scorecard
            --runner-class github-ubuntu-latest-x64
            --output artifacts/benchmark-workflow-state.json
          )

          if [[ -n "${BEFORE_REVISION}" ]]; then
            state_arguments+=(--before-revision "${BEFORE_REVISION}")
          fi

          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Hosted performance evidence must originate from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          # Comparison mode never reads or mutates proposal state. Proposal
          # maintenance belongs exclusively to reviewed seed recalibration.
          if [[ "${mode}" == "seed" ]]; then
            proposal_number="$(
              gh pr list \
                --repo "${GITHUB_REPOSITORY}" \
                --state open \
                --head "${baseline_branch}" \
                --json number \
                --jq '.[0].number // empty'
            )"
          fi

          if [[ "${mode}" == "seed" && -n "${proposal_number}" ]]; then
            baseline_path="benchmarks/baselines/doka-benchmark-baseline.json"
            proposed_baseline="artifacts/proposed-baseline.json"

            git fetch \
              --no-tags \
              origin \
              "${baseline_branch}:refs/remotes/origin/${baseline_branch}"

            proposal_base="$(
              git merge-base \
                "${GITHUB_SHA}" \
                "origin/${baseline_branch}"
            )"
            while IFS= read -r changed_path; do
              if [[ "${changed_path}" != "${baseline_path}" ]]; then
                echo "Refusing to inspect unexpected proposal path: ${changed_path}" >&2
                exit 1
              fi
            done < <(
              git diff \
                --name-only \
                --diff-filter=ACDMRTUXB \
                "${proposal_base}" \
                "origin/${baseline_branch}" \
                --
            )

            # A missing baseline is invalid proposal evidence, not an
            # unhandled shell error. The Python resolver classifies the
            # empty file as invalid. Proposal health alone cannot allocate
            # scorecard work; a relevant event can replace the proposal.
            if ! git show \
              "origin/${baseline_branch}:${baseline_path}" \
              > "${proposed_baseline}"; then
              : > "${proposed_baseline}"
            fi

            state_arguments+=(
              --proposed-baseline "${proposed_baseline}"
              --proposal-head-ref "origin/${baseline_branch}"
            )
          fi

          python3 -m eng.performance.workflow_state "${state_arguments[@]}"

          {
            echo "contract-version=${contract_version}"
            echo "mode=${mode}"
            echo "baseline-branch=${baseline_branch}"
            echo "comparison-mode=$(jq -er '.comparisonMode' artifacts/benchmark-workflow-state.json)"
            echo "measurement-tier=$(jq -er '.measurementTier' artifacts/benchmark-workflow-state.json)"
            echo "sync-required=$(jq -er '.syncRequired' artifacts/benchmark-workflow-state.json)"
            echo "proposal-required=$(jq -er '.proposalRequired' artifacts/benchmark-workflow-state.json)"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Benchmark workflow decision"
            echo
            echo "- Requested: $(jq -r '.requestedMode' artifacts/baseline-mode.json)"
            echo "- Selected: ${mode}"
            echo "- Comparison: $(jq -r '.comparisonMode' artifacts/benchmark-workflow-state.json)"
            echo "- Baseline: $(jq -r '.baselineDisposition' artifacts/baseline-mode.json)"
            echo "- Proposal: $(jq -r '.proposal.disposition' artifacts/benchmark-workflow-state.json)"
            echo "- Measurement tier: $(jq -r '.measurementTier' artifacts/benchmark-workflow-state.json)"
            echo "- Proposal sync required: $(jq -r '.syncRequired' artifacts/benchmark-workflow-state.json)"
            echo "- Proposal write required: $(jq -r '.proposalRequired' artifacts/benchmark-workflow-state.json)"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Validate the external identity before allocating scorecard runners.
      # The unused token is revoked by the action's post step; a fresh token is
      # minted only after a proposal branch has actually been updated.
      - name: Verify baseline automation identity
        if: >-
          steps.resolve.outputs.sync-required == 'true'
          || steps.resolve.outputs.proposal-required == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DOKA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOKA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

  sync-baseline-proposal:
    if: needs.resolve-baseline-mode.outputs.sync-required == 'true'
    needs: resolve-baseline-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write
      contents: write

    steps:
      # This job pushes the reviewed baseline branch, so the checkout token
      # must stay available to Git. What bounds that credential is the trigger
      # and the permission set: the workflow runs only from the default branch
      # and never on fork input, and the job requests contents plus actions
      # write and nothing else. The tree-diff guard below is content control on
      # top of that, not the boundary itself.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # An unrelated main change must not spend another scorecard run merely to
      # make the existing proposal mergeable. The tree-diff guard proves that
      # the automation branch still changes only the reviewed baseline file.
      - name: Synchronize current proposal with main
        env:
          BASELINE_BRANCH: ${{ needs.resolve-baseline-mode.outputs.baseline-branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_path="benchmarks/baselines/doka-benchmark-baseline.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch \
            --no-tags \
            origin \
            "${BASELINE_BRANCH}:refs/remotes/origin/${BASELINE_BRANCH}"
          git switch \
            --create "${BASELINE_BRANCH}" \
            --track "origin/${BASELINE_BRANCH}"
          git merge --no-edit "${GITHUB_SHA}"

          while IFS= read -r changed_path; do
            if [[ "${changed_path}" != "${baseline_path}" ]]; then
              echo "Refusing to synchronize unexpected proposal path: ${changed_path}" >&2
              exit 1
            fi
          done < <(git diff --name-only "${GITHUB_SHA}" HEAD)

          python3 -m eng.performance.cli validate-baseline \
            --contract benchmarks/performance-contract.json \
            --baseline "${baseline_path}" \
            --output artifacts/baseline-validation.json
          git push origin "HEAD:refs/heads/${BASELINE_BRANCH}"

          # Pushes made with GITHUB_TOKEN do not start another workflow. Use a
          # bounded trusted dispatch so the required checks bind to this exact
          # proposal head without enabling the expensive CI profile.
          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BASELINE_BRANCH}" \
            --field profile=baseline-proposal

          {
            echo "## Baseline proposal synchronized"
            echo
            echo "- Branch: ${BASELINE_BRANCH}"
            echo "- Scorecard rerun: not required"
            echo "- Pull-request checks: queued for the updated proposal head"
          } >> "${GITHUB_STEP_SUMMARY}"

  benchmark-smoke:
    if: needs.resolve-baseline-mode.outputs.measurement-tier == 'smoke'
    needs: resolve-baseline-mode
    uses: ./.github/workflows/benchmark-smoke.yml
    permissions:
      contents: read

  benchmark-scorecard:
    if: needs.resolve-baseline-mode.outputs.measurement-tier == 'scorecard'
    needs: resolve-baseline-mode
    uses: ./.github/workflows/benchmark-scorecard.yml
    with:
      comparison_mode: ${{ needs.resolve-baseline-mode.outputs.comparison-mode }}
    permissions:
      contents: read
      actions: read

  propose-baseline-update:
    if: needs.resolve-baseline-mode.outputs.proposal-required == 'true'
    needs:
      - resolve-baseline-mode
      - benchmark-scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      baseline-changed: ${{ steps.candidate.outputs.baseline-changed }}

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      # This job pushes the proposal branch and opens its pull request, so the
      # checkout token must stay available to Git. The trigger and the
      # permission set bound that credential; the branch ruleset decides
      # whether the resulting pull request can merge. The three tree-diff
      # guards below constrain what may be committed, which is damage control
      # rather than the boundary.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # The scorecard expands the target set from the contract. Downloading by
      # pattern keeps proposal assembly on that same source of truth.
      - name: Download required-target evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-artifacts-*
          path: artifacts/benchmark-downloads

      - name: Build combined baseline candidate
        id: candidate
        env:
          BASELINE_VERSION: github-${{ github.run_id }}
        run: |
          evidence_arguments=()
          while IFS= read -r target; do
            artifact_root="artifacts/benchmark-downloads/benchmark-artifacts-${target}"
            mapfile -t target_evidence < <(
              find "${artifact_root}" -type f -name performance-evaluation.json
            )
            if [[ "${#target_evidence[@]}" -ne 1 ]]; then
              echo "Expected one evaluation for required target '${target}', found ${#target_evidence[@]}." >&2
              exit 1
            fi
            evidence_arguments+=(--evidence "${target_evidence[0]}")
          done < <(jq -er '.requiredTargets | keys[]' benchmarks/performance-contract.json)

          python3 -m eng.performance.cli seed \
            --contract benchmarks/performance-contract.json \
            --baseline artifacts/doka-benchmark-baseline.candidate.json \
            --version "${BASELINE_VERSION}" \
            --merge-existing benchmarks/baselines/doka-benchmark-baseline.json \
            "${evidence_arguments[@]}"

          python3 -m eng.performance.cli validate-baseline \
            --contract benchmarks/performance-contract.json \
            --baseline artifacts/doka-benchmark-baseline.candidate.json \
            --output artifacts/baseline-validation.json

          python3 -m eng.performance.cli compare-baselines \
            --contract benchmarks/performance-contract.json \
            --current benchmarks/baselines/doka-benchmark-baseline.json \
            --candidate artifacts/doka-benchmark-baseline.candidate.json \
            --output artifacts/baseline-comparison.json

          echo "baseline-changed=$(jq -er '.changed' artifacts/baseline-comparison.json)" >> "${GITHUB_OUTPUT}"

      # Preserve the complete review input even though the normal maintainer
      # path is the pull-request diff rather than a downloaded artifact.
      - name: Upload baseline review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-baseline-review-evidence
          path: |
            artifacts/doka-benchmark-baseline.candidate.json
            artifacts/baseline-comparison.json
            artifacts/baseline-validation.json

      - name: Report unchanged accepted baseline
        if: steps.candidate.outputs.baseline-changed != 'true'
        run: |
          {
            echo "## Baseline proposal"
            echo
            echo "Seed evidence changed provenance only."
            echo "The accepted performance contract is unchanged, so no branch or pull request was created."
          } >> "${GITHUB_STEP_SUMMARY}"

      # The proposal is written by a trusted workflow and then receives a
      # bounded CI dispatch for its exact head. The dispatch executes only the
      # three cheap required checks; automation never approves or bypasses the
      # proposal's protected-branch requirements.
      - name: Propose reviewed baseline update
        if: steps.candidate.outputs.baseline-changed == 'true'
        env:
          BASELINE_BRANCH: ${{ needs.resolve-baseline-mode.outputs.baseline-branch }}
          CONTRACT_VERSION: ${{ needs.resolve-baseline-mode.outputs.contract-version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_path="benchmarks/baselines/doka-benchmark-baseline.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote \
            --exit-code \
            --heads origin \
            "refs/heads/${BASELINE_BRANCH}" > /dev/null 2>&1; then
            git fetch \
              --no-tags \
              origin \
              "${BASELINE_BRANCH}:refs/remotes/origin/${BASELINE_BRANCH}"
            git switch \
              --create "${BASELINE_BRANCH}" \
              --track "origin/${BASELINE_BRANCH}"
            git merge --no-edit "${GITHUB_SHA}"
          else
            git switch --create "${BASELINE_BRANCH}" "${GITHUB_SHA}"
          fi

          while IFS= read -r changed_path; do
            if [[ "${changed_path}" != "${baseline_path}" ]]; then
              echo "Refusing to update unexpected proposal path: ${changed_path}" >&2
              exit 1
            fi
          done < <(git diff --name-only "${GITHUB_SHA}" HEAD)

          install \
            -m 0644 \
            artifacts/doka-benchmark-baseline.candidate.json \
            "${baseline_path}"

          while IFS= read -r changed_path; do
            if [[ "${changed_path}" != "${baseline_path}" ]]; then
              echo "Refusing to commit unexpected proposal path: ${changed_path}" >&2
              exit 1
            fi
          done < <(git diff --name-only "${GITHUB_SHA}")

          python3 -m eng.performance.cli validate-baseline \
            --contract benchmarks/performance-contract.json \
            --baseline "${baseline_path}" \
            --output artifacts/baseline-validation.json

          git add "${baseline_path}"
          if ! git diff --cached --quiet; then
            commit_message="${RUNNER_TEMP}/performance-baseline-commit.txt"
            {
              echo "perf(benchmarks): refresh hosted performance baseline"
              echo
              echo "- Keep strict hosted comparison aligned with the active contract."
              echo "- Accept the validated complete LTS scorecard evidence."
            } > "${commit_message}"
            git commit --file "${commit_message}"
          fi

          git push \
            --set-upstream origin \
            "HEAD:refs/heads/${BASELINE_BRANCH}"

          proposal_body="${RUNNER_TEMP}/performance-baseline-pr.md"
          # The single-quoted printf formats carry literal Markdown backticks;
          # every value is passed as an argument rather than interpolated.
          # shellcheck disable=SC2016
          {
            echo "This pull request proposes the validated hosted baseline for the active performance contract."
            echo
            printf -- '- Contract version: `%s`\n' "${CONTRACT_VERSION}"
            printf -- '- Source commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Evidence run: [benchmark %s](%s/%s/actions/runs/%s)\n' \
              "${GITHUB_RUN_ID}" \
              "${GITHUB_SERVER_URL}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_RUN_ID}"
            echo
            echo "The workflow validated the complete contract-derived LTS scorecard matrix before opening this review."
            echo "The workflow never approves its own pull request."
            echo "A repository-scoped GitHub App schedules squash auto-merge without bypassing maintainer approval or protected checks."
            echo
            echo "The workflow explicitly dispatches the three required repository checks for the exact proposal head."
            echo "Review the baseline diff and approve the pull request; no workflow approval or artifact download is required."
          } > "${proposal_body}"

          proposal_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --head "${BASELINE_BRANCH}" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${proposal_number}" ]]; then
            proposal_update="${RUNNER_TEMP}/performance-baseline-pr.json"
            jq -n \
              --arg title "perf(benchmarks): refresh hosted performance baseline" \
              --rawfile body "${proposal_body}" \
              '{title: $title, body: $body}' \
              > "${proposal_update}"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${proposal_number}" \
              --input "${proposal_update}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${DEFAULT_BRANCH}" \
              --head "${BASELINE_BRANCH}" \
              --title "perf(benchmarks): refresh hosted performance baseline" \
              --body-file "${proposal_body}"

            proposal_number="$(
              gh pr list \
                --repo "${GITHUB_REPOSITORY}" \
                --state open \
                --head "${BASELINE_BRANCH}" \
                --json number \
                --jq '.[0].number // empty'
            )"
          fi

          if [[ -z "${proposal_number}" ]]; then
            echo "The baseline proposal pull request could not be resolved." >&2
            exit 1
          fi

          # GITHUB_TOKEN branch updates intentionally do not trigger another
          # workflow. Dispatch the restricted profile only after the proposal
          # exists so its required checks attach to the reviewed head.
          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BASELINE_BRANCH}" \
            --field profile=baseline-proposal

          {
            echo "## Baseline review proposed"
            echo
            echo "- Branch: ${BASELINE_BRANCH}"
            echo "- Pull-request checks: explicitly dispatched for the proposal head"
            echo "- Auto-merge: delegated to the repository-scoped GitHub App"
            echo "- Acceptance: maintainer approval and protected checks"
          } >> "${GITHUB_STEP_SUMMARY}"

  ensure-baseline-auto-merge:
    if: >-
      always()
      && (
        needs.sync-baseline-proposal.result == 'success'
        || (
          needs.propose-baseline-update.result == 'success'
          && needs.propose-baseline-update.outputs.baseline-changed == 'true'
        )
      )
    needs:
      - resolve-baseline-mode
      - sync-baseline-proposal
      - propose-baseline-update
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    steps:
      # Branch and PR updates retain GITHUB_TOKEN plus the restricted CI
      # dispatch. Only merge authority crosses the App boundary, so the App
      # cannot create unreviewed content or multiply pull-request workflows.
      - name: Create baseline automation token
        id: baseline-automation-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DOKA_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOKA_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Require App-owned squash auto-merge
        env:
          BASELINE_AUTOMATION_LOGIN: app/${{ steps.baseline-automation-token.outputs.app-slug }}
          BASELINE_AUTOMATION_TOKEN: ${{ steps.baseline-automation-token.outputs.token }}
          BASELINE_BRANCH: ${{ needs.resolve-baseline-mode.outputs.baseline-branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t proposal_numbers < <(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --head "${BASELINE_BRANCH}" \
              --json number \
              --jq '.[].number'
          )

          if [[ "${#proposal_numbers[@]}" -ne 1 ]]; then
            echo "Expected exactly one open baseline proposal." >&2
            exit 1
          fi
          proposal_number="${proposal_numbers[0]}"

          proposal_contract="$(
            gh pr view \
              --repo "${GITHUB_REPOSITORY}" \
              --json autoMergeRequest,headRefOid \
              "${proposal_number}"
          )"
          auto_merge_method="$(
            jq -r '.autoMergeRequest.mergeMethod // empty' \
              <<< "${proposal_contract}"
          )"
          auto_merge_actor="$(
            jq -r '.autoMergeRequest.enabledBy.login // empty' \
              <<< "${proposal_contract}"
          )"
          proposal_head="$(jq -er '.headRefOid' <<< "${proposal_contract}")"

          if [[ ! "${proposal_head}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The baseline proposal head could not be verified." >&2
            exit 1
          fi

          if [[ -n "${auto_merge_method}" && "${auto_merge_method}" != "SQUASH" ]]; then
            echo "Refusing to replace unexpected ${auto_merge_method} auto-merge policy." >&2
            exit 1
          fi

          if [[ -n "${auto_merge_method}" && -z "${auto_merge_actor}" ]]; then
            echo "The existing auto-merge actor could not be verified." >&2
            exit 1
          fi

          # Migrate an auto-merge request created by an earlier GITHUB_TOKEN
          # workflow. GitHub's Actor contract renders that installation as
          # app/github-actions, which differs from its commit-bot identity.
          # A maintainer-owned request is already safe and remains untouched;
          # every new request is registered by the dedicated app.
          # Remove this transition branch after the first App-owned baseline
          # proposal has merged and GitHub reports no open legacy request; the
          # removal criterion is governed by D-019 and its contract test.
          if [[ "${auto_merge_actor}" == "app/github-actions" ]]; then
            GH_TOKEN="${BASELINE_AUTOMATION_TOKEN}" gh pr merge \
              --repo "${GITHUB_REPOSITORY}" \
              --disable-auto \
              "${proposal_number}"
            auto_merge_method=""
            auto_merge_actor=""
          fi

          app_registration_required="false"
          if [[ -z "${auto_merge_method}" ]]; then
            GH_TOKEN="${BASELINE_AUTOMATION_TOKEN}" gh pr merge \
              --repo "${GITHUB_REPOSITORY}" \
              --auto \
              --squash \
              --match-head-commit "${proposal_head}" \
              "${proposal_number}"
            app_registration_required="true"
          fi

          # Do not infer success from gh's zero exit code. Read the resulting
          # actor back from GitHub and bind it to the exact App installation.
          # An immediately mergeable pull request can already be closed by the
          # time this read occurs, so both registered and merged states are
          # part of the same successful App-owned transition.
          if [[ "${app_registration_required}" == "true" ]]; then
            registration_state="$(
              gh pr view \
                --repo "${GITHUB_REPOSITORY}" \
                --json autoMergeRequest,mergedBy,state \
                "${proposal_number}"
            )"
            proposal_state="$(jq -er '.state' <<< "${registration_state}")"

            if [[ "${proposal_state}" == "OPEN" ]]; then
              auto_merge_method="$(
                jq -er '.autoMergeRequest.mergeMethod' \
                  <<< "${registration_state}"
              )"
              auto_merge_actor="$(
                jq -er '.autoMergeRequest.enabledBy.login' \
                  <<< "${registration_state}"
              )"
              if [[ "${auto_merge_method}" != "SQUASH" \
                || "${auto_merge_actor}" != "${BASELINE_AUTOMATION_LOGIN}" ]]; then
                echo "The App-owned auto-merge registration could not be verified." >&2
                exit 1
              fi
            elif [[ "${proposal_state}" == "MERGED" ]]; then
              auto_merge_actor="$(
                jq -er '.mergedBy.login' <<< "${registration_state}"
              )"
              if [[ "${auto_merge_actor}" != "${BASELINE_AUTOMATION_LOGIN}" ]]; then
                echo "The immediate baseline merge was not performed by the App." >&2
                exit 1
              fi
              auto_merge_method="SQUASH"
            else
              echo "Unexpected baseline proposal state: ${proposal_state}" >&2
              exit 1
            fi
          fi

          {
            echo "## Baseline auto-merge"
            echo
            echo "- Pull request: #${proposal_number}"
            echo "- Method: squash"
            echo "- Actor: ${auto_merge_actor}"
            echo "- Acceptance: maintainer approval and protected checks"
          } >> "${GITHUB_STEP_SUMMARY}"
