name: benchmark
run-name: ${{ inputs.maintenance && format('maintenance {0}', inputs.schedule_correlation) || 'benchmark' }}
# release-line-schedule: {"schemaVersion":1,"producers":["resolve-targets","benchmark"]}

# Benchmarks run only by explicit request or monthly schedule. BenchmarkDotNet
# owns measurement. Hosted runs enforce allocations/resource correctness only;
# timings, GC/heap behavior and throughput are diagnostics, not runner-speed gates.
on:
  workflow_dispatch:
    inputs:
      maintenance:
        description: Run this branch's scheduled maintenance workload.
        type: boolean
        default: false
      expected_commit:
        description: Exact branch head resolved by the schedule coordinator.
        type: string
        default: ""
      schedule_correlation:
        description: Immutable coordinator run and attempt identity.
        type: string
        default: ""
      profile:
        description: Select the benchmark depth.
        required: true
        default: scorecard
        type: choice
        options:
          - smoke
          - scorecard
          - stress
  schedule:
    - cron: "15 2 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Normal execution remains nonpublishing
        if: ${{ !inputs.maintenance }}
        run: echo "Normal execution does not grant release authority."
      - name: Checkout branch-native maintenance guard
        if: inputs.maintenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact active maintenance producer
        if: inputs.maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SCHEDULE_CORRELATION: ${{ inputs.schedule_correlation }}
        run: >-
          python3 eng/release/schedules.py validate-child --workflow benchmark.yml
          --expected-commit "${EXPECTED_COMMIT}" --correlation "${SCHEDULE_CORRELATION}"

  scheduled-release-lines:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout schedule authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch and await each active branch-native producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/schedules.py run --workflow benchmark.yml --output artifacts/release-lines/schedule-benchmark.json
      - name: Upload exact scheduled child evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-line-schedule-benchmark
          path: artifacts/release-lines/schedule-benchmark.json
          if-no-files-found: warn

  resolve-targets:
    needs: schedule-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      profile: ${{ steps.contract.outputs.profile }}
      targets: ${{ steps.contract.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the contract-owned matrix
        id: contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          profile="${REQUESTED_PROFILE}"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            profile="scorecard"
          fi
          jq -e --arg profile "${profile}" '.profiles[$profile] != null' \
            benchmarks/performance-contract.json > /dev/null
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          echo "targets=$(jq -cer '.requiredTargets | keys' benchmarks/performance-contract.json)" \
            >> "${GITHUB_OUTPUT}"

  benchmark:
    needs: resolve-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-targets.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Measure benchmarks and enforce allocations and resource correctness
        env:
          DOKA_BENCHMARK_EVALUATION: allocations-only
          DOKA_BENCHMARK_PROFILE: ${{ needs.resolve-targets.outputs.profile }}
          DOKA_BENCHMARK_RUN_ID: github-${{ github.run_id }}-${{ matrix.target }}
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-24.04-x64
          DOKA_BENCHMARK_TARGET: ${{ matrix.target }}
        run: |
          diagnostic="artifacts/benchmarks/${DOKA_BENCHMARK_TARGET}/diagnostics/${DOKA_BENCHMARK_RUN_ID}.log"
          mkdir -p "$(dirname "${diagnostic}")"
          set +e
          bash ./eng/benchmark.sh --up-run-down 2>&1 | tee "${diagnostic}"
          statuses=("${PIPESTATUS[@]}")
          set -e
          # Diagnostic-only thresholds are retained in this log; losing it is invalid evidence.
          if (( statuses[1] != 0 )); then
            echo "Could not retain benchmark diagnostics." >&2
            exit 78
          fi
          exit "${statuses[0]}"

      - name: Upload raw benchmark evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.target }}-${{ github.run_id }}
          path: artifacts/benchmarks/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
