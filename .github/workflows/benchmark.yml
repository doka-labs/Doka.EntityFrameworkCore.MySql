name: benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

jobs:
  benchmark-scorecard:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        benchmark-target:
          - mysql84
          - mariadb118

    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: benchmark_suite
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb118:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: benchmark_suite
          MARIADB_USER: doka
          MARIADB_PASSWORD: doka_password
        ports:
          - 33069:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run benchmark scorecard
        env:
          DOKA_BENCHMARK_PROFILE: scorecard
          DOKA_BENCHMARK_TARGET: ${{ matrix.benchmark-target }}
        run: bash ./eng/benchmark.sh --test-only

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-artifacts-${{ matrix.benchmark-target }}
          path: artifacts/benchmarks/${{ matrix.benchmark-target }}
