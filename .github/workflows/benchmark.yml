name: benchmark

# Benchmarks run only by explicit request or monthly schedule. BenchmarkDotNet
# owns measurement; the benchmark executable evaluates its raw reports once.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Select the benchmark depth.
        required: true
        default: scorecard
        type: choice
        options:
          - smoke
          - scorecard
          - stress
  schedule:
    - cron: "15 2 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      profile: ${{ steps.contract.outputs.profile }}
      targets: ${{ steps.contract.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the contract-owned matrix
        id: contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          profile="${REQUESTED_PROFILE}"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            profile="scorecard"
          fi
          jq -e --arg profile "${profile}" '.profiles[$profile] != null' \
            benchmarks/performance-contract.json > /dev/null
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          echo "targets=$(jq -cer '.requiredTargets | keys' benchmarks/performance-contract.json)" \
            >> "${GITHUB_OUTPUT}"

  benchmark:
    needs: resolve-targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-targets.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run BenchmarkDotNet and the performance gate
        env:
          DOKA_BENCHMARK_PROFILE: ${{ needs.resolve-targets.outputs.profile }}
          DOKA_BENCHMARK_RUN_ID: github-${{ github.run_id }}-${{ matrix.target }}
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
          DOKA_BENCHMARK_TARGET: ${{ matrix.target }}
        run: |
          diagnostic="artifacts/benchmarks/${DOKA_BENCHMARK_TARGET}/diagnostics/${DOKA_BENCHMARK_RUN_ID}.log"
          mkdir -p "$(dirname "${diagnostic}")"
          set +e
          bash ./eng/benchmark.sh --up-run-down 2>&1 | tee "${diagnostic}"
          status="${PIPESTATUS[0]}"
          set -e
          exit "${status}"

      - name: Upload raw benchmark evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ matrix.target }}-${{ github.run_id }}
          path: artifacts/benchmarks/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
