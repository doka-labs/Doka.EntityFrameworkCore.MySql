          )"
          echo "attempt-profile=${attempt_profile}" >> "${GITHUB_OUTPUT}"

      - name: Run MySQL 8.4 scorecard attempt 2
        id: benchmark
        env:
          DOKA_BENCHMARK_PROFILE: scorecard
          DOKA_BENCHMARK_BASELINE_MODE: ${{ inputs.baseline_mode }}
          DOKA_BENCHMARK_COMPARISON_MODE: ${{ inputs.comparison_mode }}
