name: benchmark-scorecard

# The public control plane expands the canonical target contract. Adding an LTS
# target to the contract therefore adds its scorecard without duplicating a job
# or adding another manually triggered workflow.
on:
  workflow_call:
    inputs:
      comparison_mode:
        description: Paired comparison or historical baseline seeding.
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve required benchmark targets
        id: targets
        run: |
          targets="$(jq -cer '.requiredTargets | keys' benchmarks/performance-contract.json)"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  benchmark-target:
    needs: resolve-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-targets.outputs.targets) }}
    uses: ./.github/workflows/benchmark-target.yml
    with:
      target: ${{ matrix.target }}
      comparison_mode: ${{ inputs.comparison_mode }}
    permissions:
      contents: read
      actions: read

  qualify-paired-scorecard:
    if: inputs.comparison_mode == 'paired'
    needs:
      - resolve-targets
      - benchmark-target
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download selected target evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-artifacts-*
          path: artifacts/scorecard-targets

      # A target can validate its own hard gates, but it cannot control the
      # risk of one false red across the complete engine matrix. This
      # job is the single automatic fan-in that applies Holm to all required
      # target endpoints; maintainers do not dispatch another workflow.
      - name: Qualify the complete paired scorecard
        run: |
          evaluations=()
          while IFS= read -r path; do
            evaluations+=(--evaluation "${path}")
          done < <(
            find artifacts/scorecard-targets \
              -type f \
              -name paired-evaluation.json \
              -print \
              | sort
          )
          python3 -m eng.performance.cli qualify-scorecard \
            --contract benchmarks/performance-contract.json \
            "${evaluations[@]}" \
            --output artifacts/paired-scorecard-qualification.json

      - name: Upload paired scorecard qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-scorecard-qualification
          path: artifacts/paired-scorecard-qualification.json
          if-no-files-found: error
          retention-days: 7
