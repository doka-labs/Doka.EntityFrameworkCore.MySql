          DOKA_BENCHMARK_TARGET: mysql84
          DOKA_BENCHMARK_RUN_ID: ${{ steps.identity.outputs.run-id }}
          DOKA_BENCHMARK_COMMIT: ${{ github.sha }}
          DOKA_BENCHMARK_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
        run: |
          set +e
          bash ./eng/benchmark.sh --test-only
          exit_code=$?
          set -e
          echo "exit-code=${exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Record MySQL 8.4 attempt 2
        id: receipt
        env:
          ATTEMPT_COMMIT: ${{ github.sha }}
          ATTEMPT_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          ATTEMPT_PROFILE: ${{ steps.identity.outputs.attempt-profile }}
          ATTEMPT_EXIT_CODE: ${{ steps.benchmark.outputs.exit-code }}
          ATTEMPT_RUN_ID: ${{ steps.identity.outputs.run-id }}
          ATTEMPT_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
        run: |
          artifact_root="artifacts/benchmarks/mysql84"
          receipt="${artifact_root}/performance-attempt.json"
          python3 -m eng.performance.cli record-attempt \
            --artifact-root "${artifact_root}" \
            --report-directory "${artifact_root}/reports/${ATTEMPT_RUN_ID}" \
            --target mysql84 \
            --profile "${ATTEMPT_PROFILE}" \
            --attempt 2 \
            --run-id "${ATTEMPT_RUN_ID}" \
            --commit "${ATTEMPT_COMMIT}" \
            --source-hash "${ATTEMPT_SOURCE_HASH}" \
            --runner-class github-ubuntu-latest-x64 \
            --exit-code "${ATTEMPT_EXIT_CODE}" \
            --comparison-mode "${ATTEMPT_COMPARISON_MODE}" \
            --output "${receipt}"
          python3 -m eng.performance.cli attempt-outputs \
            --receipt "${receipt}" >> "${GITHUB_OUTPUT}"

      - name: Upload MySQL 8.4 attempt 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-attempt-mysql84-2
          path: artifacts/benchmarks/mysql84
          if-no-files-found: error
          retention-days: 7

  mysql84-select:
    needs:
      - mysql84-attempt-1
      - mysql84-attempt-2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MySQL 8.4 attempt 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-attempt-mysql84-1
          path: artifacts/attempts/mysql84/attempt-1

      - name: Download MySQL 8.4 attempt 2
        if: needs.mysql84-attempt-2.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-attempt-mysql84-2
          path: artifacts/attempts/mysql84/attempt-2

      - name: Select conclusive MySQL 8.4 evidence
        run: |
          receipts=(
            --receipt artifacts/attempts/mysql84/attempt-1/performance-attempt.json
          )
          if [[ -f artifacts/attempts/mysql84/attempt-2/performance-attempt.json ]]; then
            receipts+=(
              --receipt artifacts/attempts/mysql84/attempt-2/performance-attempt.json
            )
          fi
          python3 -m eng.performance.cli select-attempt \
            "${receipts[@]}" \
            --destination artifacts/benchmarks/mysql84 \
            --output artifacts/benchmarks/mysql84/performance-attempt-selection.json

      - name: Upload qualified MySQL 8.4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-artifacts-mysql84
          path: artifacts/benchmarks/mysql84
