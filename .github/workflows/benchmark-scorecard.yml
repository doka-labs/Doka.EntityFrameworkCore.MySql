name: benchmark-scorecard

# This reusable workflow separates measurements from their control plane. A
# measurement-quality exit may receive one retry on a new hosted runner, while
# build, correctness, infrastructure, and budget failures remain conclusive.
on:
  workflow_call:
    inputs:
      baseline_mode:
        description: Validated comparison or seed mode selected by the caller.
        required: false
        default: compare
        type: string
      comparison_mode:
        # `historical` compares one measurement against an accepted
        # baseline recorded on another host, which is why it needs
        # baseline_mode. `paired` measures a reference and a candidate
        # provider in the same allocated job, so it needs neither a
        # baseline nor an environment match against a recorded machine.
        description: Which comparison the scorecard performs.
        required: false
        default: historical
        type: string

permissions:
  contents: read

jobs:
  mysql84-attempt-1:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      status: ${{ steps.receipt.outputs.status }}
      retry: ${{ steps.receipt.outputs.retry }}

    services:
      mysql84:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: benchmark_suite
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A paired comparison packs the provider from its reference commit,
          # so the history back to that commit must be present. A shallow
          # checkout fails at the worktree, after the runner is allocated.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve immutable attempt identity
        id: identity
        env:
          COMPARISON_MODE: ${{ inputs.comparison_mode }}
          DISPATCH_PROFILE: scorecard
        run: |
          echo "run-id=github-${GITHUB_RUN_ID}-mysql84-attempt-1" >> "${GITHUB_OUTPUT}"
          source_hash="$(python3 -m eng.performance.cli source-hash --repo .)"
          echo "source-hash=${source_hash}" >> "${GITHUB_OUTPUT}"
          # A paired run measures under the registered block profile, not under
          # the profile this job is dispatched with. The receipt has to record
          # the one that measured.
          attempt_profile="$(
            python3 -m eng.performance.cli attempt-profile \
              --contract benchmarks/performance-contract.json \
              --profile "${DISPATCH_PROFILE}" \
              --comparison-mode "${COMPARISON_MODE}"
          )"
          echo "attempt-profile=${attempt_profile}" >> "${GITHUB_OUTPUT}"

      # The raw exit is recorded as evidence so only the typed selector can
      # authorize a retry; this step must not collapse every nonzero exit into
      # the same GitHub Actions failure state.
      - name: Run MySQL 8.4 scorecard attempt 1
        id: benchmark
        env:
          DOKA_BENCHMARK_PROFILE: scorecard
          DOKA_BENCHMARK_BASELINE_MODE: ${{ inputs.baseline_mode }}
          DOKA_BENCHMARK_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
          DOKA_BENCHMARK_TARGET: mysql84
          DOKA_BENCHMARK_RUN_ID: ${{ steps.identity.outputs.run-id }}
          DOKA_BENCHMARK_COMMIT: ${{ github.sha }}
          DOKA_BENCHMARK_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
        run: |
          set +e
          bash ./eng/benchmark.sh --test-only
          exit_code=$?
          set -e
          echo "exit-code=${exit_code}" >> "${GITHUB_OUTPUT}"

      # Expansions reach the shell through env so no step output is ever
      # spliced into this script's source text.
      - name: Record MySQL 8.4 attempt 1
        id: receipt
        env:
          ATTEMPT_COMMIT: ${{ github.sha }}
          ATTEMPT_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          ATTEMPT_PROFILE: ${{ steps.identity.outputs.attempt-profile }}
          ATTEMPT_EXIT_CODE: ${{ steps.benchmark.outputs.exit-code }}
          ATTEMPT_RUN_ID: ${{ steps.identity.outputs.run-id }}
          ATTEMPT_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
        run: |
          artifact_root="artifacts/benchmarks/mysql84"
          receipt="${artifact_root}/performance-attempt.json"
          python3 -m eng.performance.cli record-attempt \
            --artifact-root "${artifact_root}" \
            --report-directory "${artifact_root}/reports/${ATTEMPT_RUN_ID}" \
            --target mysql84 \
            --profile "${ATTEMPT_PROFILE}" \
            --attempt 1 \
            --run-id "${ATTEMPT_RUN_ID}" \
            --commit "${ATTEMPT_COMMIT}" \
            --source-hash "${ATTEMPT_SOURCE_HASH}" \
            --runner-class github-ubuntu-latest-x64 \
            --exit-code "${ATTEMPT_EXIT_CODE}" \
            --comparison-mode "${ATTEMPT_COMPARISON_MODE}" \
            --output "${receipt}"
          python3 -m eng.performance.cli attempt-outputs \
            --receipt "${receipt}" >> "${GITHUB_OUTPUT}"

      - name: Upload MySQL 8.4 attempt 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-attempt-mysql84-1
          path: artifacts/benchmarks/mysql84
          if-no-files-found: error
          retention-days: 7

  mysql84-attempt-2:
