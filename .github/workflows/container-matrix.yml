name: container-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 2"

permissions:
  contents: read

jobs:
  compatibility-matrix:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run scheduled container compatibility path
        env:
          DOKA_INTEGRATION_TARGETS: mysql84,mariadb114,mariadb118
        run: bash ./eng/test-integration.sh

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-matrix-artifacts
          path: artifacts/integration
