name: container-matrix
run-name: ${{ inputs.maintenance && format('maintenance {0}', inputs.schedule_correlation) || 'container-matrix' }}
# release-line-schedule: {"schemaVersion":1,"producers":["compatibility-matrix"]}

on:
  workflow_dispatch:
    inputs:
      maintenance:
        description: Run this branch's scheduled maintenance workload.
        type: boolean
        default: false
      expected_commit:
        description: Exact branch head resolved by the schedule coordinator.
        type: string
        default: ""
      schedule_correlation:
        description: Immutable coordinator run and attempt identity.
        type: string
        default: ""
  schedule:
    - cron: "0 2 * * 2"

permissions:
  contents: read

jobs:
  schedule-identity:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Normal execution remains nonpublishing
        if: ${{ !inputs.maintenance }}
        run: echo "Normal execution does not grant release authority."
      - name: Checkout branch-native maintenance guard
        if: inputs.maintenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact active maintenance producer
        if: inputs.maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SCHEDULE_CORRELATION: ${{ inputs.schedule_correlation }}
        run: >-
          python3 eng/release/schedules.py validate-child --workflow container-matrix.yml
          --expected-commit "${EXPECTED_COMMIT}" --correlation "${SCHEDULE_CORRELATION}"

  scheduled-release-lines:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout schedule authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch and await each active branch-native producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/schedules.py run --workflow container-matrix.yml --output artifacts/release-lines/schedule-container-matrix.json
      - name: Upload exact scheduled child evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-line-schedule-container-matrix
          path: artifacts/release-lines/schedule-container-matrix.json
          if-no-files-found: warn

  compatibility-matrix:
    needs: schedule-identity
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run scheduled container compatibility path
        env:
          DOKA_INTEGRATION_TARGETS: >-
            mysql84,mysql97,mariadb1011,mariadb114,mariadb118,mariadb123
          DOKA_REQUIRE_FULL_CONFIGURATION_MATRIX: 1
        run: bash ./eng/test-integration.sh

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-matrix-artifacts
          path: artifacts/integration
