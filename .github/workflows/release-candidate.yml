name: release-candidate

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * 1"

permissions:
  contents: read

jobs:
  repo-local-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run repo-local release-candidate flow
        run: bash ./eng/release-candidate.sh

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate-artifacts
          path: artifacts/release-candidate
