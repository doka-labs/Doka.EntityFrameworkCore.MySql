name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-local-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DOKA_RELEASE_CANDIDATE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      DOKA_RELEASE_EXPECTED_REF: ${{ github.ref }}
      DOKA_RELEASE_REQUIRE_TAG: 1

    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run repo-local release-candidate flow
        env:
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
        run: bash ./eng/release-candidate.sh

      - name: Attest packages and immutable evidence
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.nupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.snupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.json
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.sha256

      - name: Verify hosted evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/release-candidate-evidence.json" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-artifacts
          path: artifacts/release-candidate
