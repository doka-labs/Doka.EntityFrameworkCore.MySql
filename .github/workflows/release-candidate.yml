name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-local-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run repo-local release-candidate flow
        env:
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
        run: bash ./eng/release-candidate.sh

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-artifacts
          path: artifacts/release-candidate
