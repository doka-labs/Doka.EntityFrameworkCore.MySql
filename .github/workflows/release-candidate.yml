name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate package version, for example 10.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOKA_RELEASE_CANDIDATE_RUN_ID: github-${{ github.run_id }}
  DOKA_RELEASE_EXPECTED_REF: refs/heads/main
  DOKA_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
  DOKA_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify current untagged main source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release candidates must be dispatched from main." >&2
            exit 1
          fi
          python3 -m eng.release.nuget validate-version \
            --version "${RELEASE_VERSION}"

          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "The dispatched commit is no longer current main." >&2
            exit 1
          fi
          if git tag --points-at "${GITHUB_SHA}" \
              | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Candidate qualification must complete before a semantic tag exists." >&2
            exit 1
          fi

      - name: Verify release tooling contracts
        run: |
          bash ./eng/common/verify-dotnet.sh
          bash -n ./eng/release-candidate.sh
          bash -n ./eng/release/restore-release-stage-artifacts.sh
          bash -n ./eng/testing/test-runtime-posture.sh
          bash -n ./eng/testing/test-nuget-readback.sh
          python3 -m unittest \
            eng.tests.test_materialize_sbom_assets \
            eng.tests.test_release_artifact_resolver \
            eng.tests.test_release_finalization_chain \
            eng.tests.test_release_provenance \
            eng.tests.test_release_stage_checkpoint \
            eng.tests.test_runtime_posture_evidence_chain

  foundation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 1800
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/package

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack and qualify exact local package bytes
        run: bash ./eng/release-candidate.sh --stage package

      - name: Upload verified package state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-package-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete package diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-package-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  engine-contracts:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - stage: migration-deployment
            timeout_minutes: 60
            deadline_seconds: 3300
          - stage: runtime
            timeout_minutes: 40
            deadline_seconds: 2100
          - stage: efcore-patch-matrix
            timeout_minutes: 60
            deadline_seconds: 3300
          - stage: mysqlconnector-patch-matrix
            timeout_minutes: 45
            deadline_seconds: 2400

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: ${{ matrix.deadline_seconds }}
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/${{ matrix.stage }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ${{ matrix.stage }} stage
        run: bash ./eng/release-candidate.sh --stage "${{ matrix.stage }}"

      - name: Upload verified ${{ matrix.stage }} state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-${{ matrix.stage }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete ${{ matrix.stage }} diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ matrix.stage }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  sbom:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 900
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/sbom

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore package input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/release/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/artifact-selections/sbom-input-artifacts.json" \
            --stage package

      - name: Run SBOM stage
        run: bash ./eng/release-candidate.sh --stage sbom

      - name: Upload verified SBOM state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-sbom-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs:
      - foundation
      - engine-contracts
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    outputs:
      candidate_artifact_name: ${{ steps.names.outputs.candidate_artifact_name }}
      checkpoint_artifact_name: ${{ steps.names.outputs.checkpoint_artifact_name }}

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 1200
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/assemble

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore complete verified stage set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/release/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/artifact-selections/assemble-input-artifacts.json" \
            --stage migration-deployment \
            --stage runtime \
            --stage efcore-patch-matrix \
            --stage mysqlconnector-patch-matrix \
            --stage package \
            --stage sbom

      - name: Assemble immutable release candidate
        env:
          DOKA_RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./eng/release-candidate.sh --stage finalize

      - name: Verify canonical qualification manifest
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          python3 -m eng.release.qualification verify \
            --manifest "${candidate_root}/release-qualification-manifest.json" \
            --root "${candidate_root}/packages" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-tree-id "$(git rev-parse 'HEAD^{tree}')" \
            --expected-release-tag "v${DOKA_RELEASE_VERSION}"

      - name: Derive symbol probes and candidate receipt
        id: candidate
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          mkdir -p "${publication_evidence}"

          dotnet run \
            --project eng/tools/Doka.EntityFrameworkCore.MySql.NuGetSymbolReadback \
            --configuration Release \
            -- \
            --candidate-root "${candidate_root}" \
            --version "${DOKA_RELEASE_VERSION}" \
            --output "${publication_evidence}/symbol-readback-manifest.json"

          python3 -m eng.release.nuget prepare \
            --repo "${GITHUB_WORKSPACE}" \
            --root "${candidate_root}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output "${publication_evidence}/candidate-receipt.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Require a completely unused public version
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          python3 -m eng.release.nuget preflight \
            --receipt "${publication_evidence}/candidate-receipt.json" \
            --candidate-root "${candidate_root}" \
            --symbol-manifest "${publication_evidence}/symbol-readback-manifest.json" \
            --output "${publication_evidence}/candidate-publication-preflight.json" \
            --require-absent

      - name: Name immutable candidate artifacts
        id: names
        run: |
          echo "candidate_artifact_name=release-candidate-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "checkpoint_artifact_name=release-checkpoints-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.candidate_artifact_name }}
          path: |
            artifacts/release-candidate
            artifacts/release-publication
          if-no-files-found: error
          retention-days: 30

      - name: Upload exhaustive stage receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.checkpoint_artifact_name }}
          path: artifacts/release-candidate-checkpoints
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      provenance_artifact_name: ${{ steps.provenance.outputs.provenance_artifact_name }}

    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write

    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble.outputs.candidate_artifact_name }}
          path: artifacts

      - name: Download exhaustive stage receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble.outputs.checkpoint_artifact_name }}
          path: artifacts/release-candidate-checkpoints

      - name: Attest packages, evidence, and stage receipts
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.nupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.snupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.json
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.sha256
            artifacts/release-publication/candidate-receipt.json
            artifacts/release-publication/candidate-publication-preflight.json
            artifacts/release-publication/symbol-readback-manifest.json
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/*.json

      - name: Materialize portable SLSA provenance
        id: provenance
        env:
          DOKA_ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        shell: bash
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          checkpoint_root="artifacts/release-candidate-checkpoints/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          output_root="artifacts/release-provenance"

          python3 -m eng.release.provenance materialize \
            --bundle "${DOKA_ATTESTATION_BUNDLE}" \
            --output "${output_root}/release-provenance.intoto.jsonl" \
            --candidate-root "${candidate_root}" \
            --publication-evidence artifacts/release-publication \
            --checkpoint-root "${checkpoint_root}"
          echo "provenance_artifact_name=release-provenance-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload portable SLSA provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.provenance.outputs.provenance_artifact_name }}
          path: artifacts/release-provenance/release-provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 30

  publish:
    needs:
      - assemble
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: nuget

    permissions:
      actions: read
      attestations: read
      checks: read
      contents: write
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout qualified source and fetch current main and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download immutable same-run candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble.outputs.candidate_artifact_name }}
          path: artifacts

      - name: Download exhaustive stage receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble.outputs.checkpoint_artifact_name }}
          path: artifacts/release-candidate-checkpoints

      - name: Download portable SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.attest.outputs.provenance_artifact_name }}
          path: artifacts/release-publication

      - name: Revalidate source, evidence, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/common/verify-dotnet.sh
          git fetch --quiet origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/tags/*:refs/tags/*
          if [[ "${GITHUB_REF}" != "refs/heads/main" \
              || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] \
              || ! git merge-base --is-ancestor \
                "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Publication requires the qualified commit to remain on current main history." >&2
            exit 1
          fi

          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          checkpoint_root="artifacts/release-candidate-checkpoints/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          provenance_bundle="artifacts/release-publication/release-provenance.intoto.jsonl"
          python3 -m eng.release.evidence verify --root "${candidate_root}"
          shopt -s nullglob
          artifacts=(
            "${candidate_root}/release-candidate-evidence.json"
            "${candidate_root}/release-candidate-evidence.sha256"
            "${candidate_root}/packages/"*.nupkg
            "${candidate_root}/packages/"*.snupkg
            artifacts/release-publication/candidate-receipt.json
            artifacts/release-publication/candidate-publication-preflight.json
            artifacts/release-publication/symbol-readback-manifest.json
            "${checkpoint_root}/"*.json
          )
          python3 -m eng.release.provenance verify \
            --bundle "${provenance_bundle}" \
            --candidate-root "${candidate_root}" \
            --publication-evidence artifacts/release-publication \
            --checkpoint-root "${checkpoint_root}"

          for artifact in "${artifacts[@]}"; do
            gh attestation verify "${artifact}" \
              --bundle "${provenance_bundle}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --signer-digest "${GITHUB_SHA}" \
              --source-ref "refs/heads/main" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done

      - name: Establish signed tag trust root and publication binding
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${DOKA_RELEASE_VERSION}"
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"

          python3 -m eng.release.trust verify \
            --repo . \
            --tag "${release_tag}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --policy eng/release/evidence-policy.json \
            --qualification-manifest \
              "${candidate_root}/release-qualification-manifest.json" \
            --output "${publication_evidence}/release-tag-trust-root.json"

          python3 -m eng.release.nuget bind \
            --repo . \
            --root "${candidate_root}" \
            --candidate-receipt "${publication_evidence}/candidate-receipt.json" \
            --tag-trust-receipt "${publication_evidence}/release-tag-trust-root.json" \
            --release-tag "${release_tag}" \
            --output "${publication_evidence}/release-publication-receipt.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Stage and verify GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          python3 -m eng.release.github prepare \
            --repository "${GITHUB_REPOSITORY}" \
            --candidate-root "${candidate_root}" \
            --publication-evidence "${publication_evidence}" \
            --changelog CHANGELOG.md \
            --output "${publication_evidence}/github-release-staged-plan.json"
          python3 -m eng.release.github stage \
            --repo . \
            --plan "${publication_evidence}/github-release-staged-plan.json" \
            --output "${publication_evidence}/github-release-draft.json"

      - name: Check NuGet.org immediately before publication
        id: preflight
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          python3 -m eng.release.nuget preflight \
            --receipt "${publication_evidence}/release-publication-receipt.json" \
            --candidate-root "${candidate_root}" \
            --symbol-manifest "${publication_evidence}/symbol-readback-manifest.json" \
            --output "${publication_evidence}/publication-preflight.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Request short-lived NuGet.org key
        if: steps.preflight.outputs.publication_required == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish provider package
        if: steps.preflight.outputs.provider_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.preflight.outputs.provider_package }}
        run: |
          dotnet nuget push "${PACKAGE}" \
            --source https://api.nuget.org/v3/index.json --no-symbols \
            --skip-duplicate --timeout 300

      - name: Publish provider symbols
        if: steps.preflight.outputs.provider_symbols_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.preflight.outputs.provider_symbols }}
        run: |
          dotnet nuget push "${PACKAGE}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 300

      - name: Publish spatial package
        if: steps.preflight.outputs.spatial_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.preflight.outputs.spatial_package }}
        run: |
          dotnet nuget push "${PACKAGE}" \
            --source https://api.nuget.org/v3/index.json --no-symbols \
            --skip-duplicate --timeout 300

      - name: Publish spatial symbols
        if: steps.preflight.outputs.spatial_symbols_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.preflight.outputs.spatial_symbols }}
        run: |
          dotnet nuget push "${PACKAGE}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 300

      - name: Publish cache package
        if: steps.preflight.outputs.cache_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.preflight.outputs.cache_package }}
        run: |
          dotnet nuget push "${PACKAGE}" \
            --source https://api.nuget.org/v3/index.json --no-symbols \
            --skip-duplicate --timeout 300

      - name: Publish cache symbols
        if: steps.preflight.outputs.cache_symbols_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.preflight.outputs.cache_symbols }}
        run: |
          dotnet nuget push "${PACKAGE}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 300

      - name: Publish and read back immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publication_evidence="artifacts/release-publication"
          python3 -m eng.release.github publish \
            --repo . \
            --plan "${publication_evidence}/github-release-staged-plan.json" \
            --output "${publication_evidence}/github-release-readback.json"

      - name: Verify public package and symbol payloads
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          python3 -m eng.release.nuget readback \
            --receipt "${publication_evidence}/release-publication-receipt.json" \
            --candidate-root "${candidate_root}" \
            --symbol-manifest "${publication_evidence}/symbol-readback-manifest.json" \
            --output-dir "${publication_evidence}/packages" \
            --output "${publication_evidence}/nuget-publication-readback.json" \
            --timeout-seconds 3600 \
            --poll-interval-seconds 30

      - name: Verify public NuGet repository signatures
        run: |
          publication_evidence="artifacts/release-publication"
          dotnet nuget verify "${publication_evidence}/packages/"*.nupkg \
            --all --verbosity normal \
            > "${publication_evidence}/nuget-signature-verification.txt" 2>&1
          cat "${publication_evidence}/nuget-signature-verification.txt"

      - name: Bind publication completion evidence
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          python3 -m eng.release.github complete \
            --repository "${GITHUB_REPOSITORY}" \
            --candidate-root "${candidate_root}" \
            --publication-evidence "${publication_evidence}" \
            --changelog CHANGELOG.md \
            --output "${publication_evidence}/release-publication-completion.json"

      - name: Upload publication completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: artifacts/release-publication
          if-no-files-found: error
          retention-days: 30
