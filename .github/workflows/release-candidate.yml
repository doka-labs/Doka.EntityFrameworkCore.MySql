name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 10.6.2
        required: true
        type: string
      qualification_only:
        description: Qualify without requesting publication or its environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOKA_RELEASE_CANDIDATE_RUN_ID: github-${{ github.run_id }}
  DOKA_RELEASE_EXPECTED_REF: ${{ github.ref }}
  DOKA_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
  DOKA_RELEASE_VERSION: ${{ inputs.version }}
  DOKA_RELEASE_LINE_FILE: artifacts/release-lines/line.json
  DOKA_RELEASE_LINES_POLICY: artifacts/release-lines/policy.json
  DOKA_RELEASE_LINE_AUTHORITY: artifacts/release-lines/authority.json

jobs:
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    outputs:
      line_artifact_name: ${{ steps.authority.outputs.line_artifact_name }}
      publish_allowed: ${{ steps.authority.outputs.publish_allowed }}

    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Freeze independently authorized release line
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
        shell: bash
        run: |
          workflow_path="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}"
          workflow_path="${workflow_path%@*}"
          authorization_arguments=()
          if [[ "${QUALIFICATION_ONLY}" != "true" ]]; then
            authorization_arguments+=(--publish)
          fi

          python3 -m eng.release.publication preflight \
            --repository "${GITHUB_REPOSITORY}" \
            --source-ref "${GITHUB_REF}" \
            --version "${RELEASE_VERSION}" \
            --workflow-path "${workflow_path}" \
            --output "${DOKA_RELEASE_LINE_FILE}" \
            --policy-output "${DOKA_RELEASE_LINES_POLICY}" \
            --authority-output "${DOKA_RELEASE_LINE_AUTHORITY}" \
            --github-output "${GITHUB_OUTPUT}" \
            "${authorization_arguments[@]}"

          echo "line_artifact_name=release-line-authorization-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          if git tag --points-at "${GITHUB_SHA}" \
              | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Candidate qualification must complete before a semantic tag exists." >&2
            exit 1
          fi

      - name: Upload frozen line authorization
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.authority.outputs.line_artifact_name }}
          path: artifacts/release-lines
          if-no-files-found: error
          retention-days: 90

      - name: Verify imported repository qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m eng.release.trust pre-tag \
            --repo . \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --policy eng/release/evidence-policy.json \
            --qualification-only

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify release tooling contracts
        run: |
          bash ./eng/common/verify-dotnet.sh
          bash -n ./eng/release-candidate.sh
          bash -n ./eng/release/restore-release-stage-artifacts.sh
          bash -n ./eng/testing/test-runtime-posture.sh
          bash -n ./eng/testing/test-nuget-readback.sh
          bash ./eng/release/test-tools.sh

  foundation:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 35

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 1800
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/package

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download frozen line authorization
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.preflight.outputs.line_artifact_name }}
          path: artifacts/release-lines

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack and qualify exact local package bytes
        run: bash ./eng/release-candidate.sh --stage package

      - name: Upload verified package state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stage-package-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete package diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics-package-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  engine-contracts:
    needs:
      - preflight
      - foundation
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - stage: migration-deployment
            timeout_minutes: 60
            deadline_seconds: 3300
          - stage: runtime
            timeout_minutes: 40
            deadline_seconds: 2100
          - stage: efcore-patch-matrix
            timeout_minutes: 60
            deadline_seconds: 3300
          - stage: mysqlconnector-patch-matrix
            timeout_minutes: 45
            deadline_seconds: 2400

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: ${{ matrix.deadline_seconds }}
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/${{ matrix.stage }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download frozen line authorization
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.preflight.outputs.line_artifact_name }}
          path: artifacts/release-lines

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ${{ matrix.stage }} stage
        run: bash ./eng/release-candidate.sh --stage "${{ matrix.stage }}"

      - name: Upload verified ${{ matrix.stage }} state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stage-${{ matrix.stage }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete ${{ matrix.stage }} diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics-${{ matrix.stage }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  sbom:
    needs:
      - preflight
      - foundation
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 900
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/sbom

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download frozen line authorization
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.preflight.outputs.line_artifact_name }}
          path: artifacts/release-lines

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore package input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/release/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/artifact-selections/sbom-input-artifacts.json" \
            --stage package

      - name: Run SBOM stage
        run: bash ./eng/release-candidate.sh --stage sbom

      - name: Upload verified SBOM state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stage-sbom-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs:
      - preflight
      - foundation
      - engine-contracts
      - sbom
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    outputs:
      candidate_artifact_name: ${{ steps.names.outputs.candidate_artifact_name }}
      checkpoint_artifact_name: ${{ steps.names.outputs.checkpoint_artifact_name }}

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 1200
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/assemble

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download frozen line authorization
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.preflight.outputs.line_artifact_name }}
          path: artifacts/release-lines

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore complete verified stage set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/release/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/artifact-selections/assemble-input-artifacts.json" \
            --stage migration-deployment \
            --stage runtime \
            --stage efcore-patch-matrix \
            --stage mysqlconnector-patch-matrix \
            --stage package \
            --stage sbom

      - name: Assemble immutable release candidate
        env:
          DOKA_RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./eng/release-candidate.sh --stage finalize

      - name: Verify canonical qualification manifest
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          python3 -m eng.release.qualification verify \
            --manifest "${candidate_root}/release-qualification-manifest.json" \
            --root "${candidate_root}/packages" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-tree-id "$(git rev-parse 'HEAD^{tree}')" \
            --expected-release-tag "v${DOKA_RELEASE_VERSION}"

      - name: Derive symbol probes and candidate receipt
        id: candidate
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          mkdir -p "${publication_evidence}"

          dotnet run \
            --project eng/tools/Doka.EntityFrameworkCore.MySql.NuGetSymbolReadback \
            --configuration Release \
            -- \
            --candidate-root "${candidate_root}" \
            --version "${DOKA_RELEASE_VERSION}" \
            --output "${publication_evidence}/symbol-readback-manifest.json"

          python3 -m eng.release.nuget prepare \
            --repo "${GITHUB_WORKSPACE}" \
            --root "${candidate_root}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output "${publication_evidence}/candidate-receipt.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Require a completely unused public version
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          publication_evidence="artifacts/release-publication"
          python3 -m eng.release.nuget preflight \
            --receipt "${publication_evidence}/candidate-receipt.json" \
            --candidate-root "${candidate_root}" \
            --symbol-manifest "${publication_evidence}/symbol-readback-manifest.json" \
            --output "${publication_evidence}/candidate-publication-preflight.json" \
            --require-absent

      - name: Name immutable candidate artifacts
        id: names
        run: |
          echo "candidate_artifact_name=release-candidate-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "checkpoint_artifact_name=release-checkpoints-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.candidate_artifact_name }}
          path: |
            artifacts/release-candidate
            artifacts/release-publication
          if-no-files-found: error
          retention-days: 30

      - name: Upload exhaustive stage receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.checkpoint_artifact_name }}
          path: artifacts/release-candidate-checkpoints
          if-no-files-found: error
          retention-days: 30

  attest:
    needs:
      - preflight
      - assemble
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    outputs:
      provenance_artifact_name: ${{ steps.provenance.outputs.provenance_artifact_name }}

    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write

    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frozen line authorization
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.preflight.outputs.line_artifact_name }}
          path: artifacts/release-lines

      - name: Download immutable release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.assemble.outputs.candidate_artifact_name }}
          path: artifacts

      - name: Download exhaustive stage receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.assemble.outputs.checkpoint_artifact_name }}
          path: artifacts/release-candidate-checkpoints

      - name: Attest packages, evidence, and stage receipts
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.nupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.snupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.json
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.sha256
            artifacts/release-publication/candidate-receipt.json
            artifacts/release-publication/candidate-publication-preflight.json
            artifacts/release-publication/symbol-readback-manifest.json
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/*.json

      - name: Materialize portable SLSA provenance
        id: provenance
        env:
          DOKA_ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        shell: bash
        run: |
          candidate_root="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          checkpoint_root="artifacts/release-candidate-checkpoints/${DOKA_RELEASE_CANDIDATE_RUN_ID}"
          output_root="artifacts/release-provenance"

          python3 -m eng.release.provenance materialize \
            --bundle "${DOKA_ATTESTATION_BUNDLE}" \
            --signer-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${output_root}/release-provenance.intoto.jsonl" \
            --candidate-root "${candidate_root}" \
            --publication-evidence artifacts/release-publication \
            --checkpoint-root "${checkpoint_root}"
          echo "provenance_artifact_name=release-provenance-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload portable SLSA provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.provenance.outputs.provenance_artifact_name }}
          path: artifacts/release-provenance/release-provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Summarize qualified candidate and existing operator actions
        env:
          QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
        shell: bash
        run: |
          # WHY: Show the exact identity only after qualification and attestations,
          # so preflight success cannot be mistaken for permission to sign a tag.
          candidate_manifest="artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/release-candidate-evidence.json"
          toolchain_rows="$(jq -er '
            .toolchain
            | [["SDK", .dotnetSdk], ["Target framework", .targetFramework],
               ["EF policy", .efCoreVersion], ["Resolved EF", .resolvedPackages["Microsoft.EntityFrameworkCore.Relational"]],
               ["MySqlConnector", .resolvedPackages.MySqlConnector],
               ["Test runner", .testRunner], ["Upstream stage", .upstreamStage]]
            | .[] | if all(.[]; type == "string" and length > 0)
              then @tsv else error("Qualified toolchain summary is incomplete") end
          ' "${candidate_manifest}")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            printf '## Qualified Doka candidate\n\n'
            printf '| Field | Qualified identity |\n| --- | --- |\n'
            printf '| Branch | %s |\n' "${GITHUB_REF#refs/heads/}"
            printf '| Commit | %s |\n' "${GITHUB_SHA}"
            printf '| Version | %s |\n' "${DOKA_RELEASE_VERSION}"
            printf '| Expected tag | v%s |\n' "${DOKA_RELEASE_VERSION}"
            while IFS=$'\t' read -r field value; do
              printf '| %s | %s |\n' "${field}" "${value}"
            done <<< "${toolchain_rows}"

            printf '\n[Qualification evidence, candidate packages and SLSA provenance](%s#artifacts).\n' "${run_url}"
            printf '\n[Qualified source](%s/%s/commit/%s).\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
            if [[ "${QUALIFICATION_ONLY}" == "true" ]]; then
              printf '\nQualification only: no publication environment, credential or tag is requested.\n'
            else
              printf '\nNext: create and push your personally signed annotated tag on this commit, then approve the waiting publication job.\n'
              printf '\nDo not dispatch another candidate or copy artifact digests; publication uses this run and these exact bytes.\n'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    # WHY: Skip the environment-bearing job itself for qualification-only and prepared lines.
    if: ${{ !inputs.qualification_only && needs.preflight.outputs.publish_allowed == 'true' }}
    needs:
      - preflight
      - assemble
      - attest
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    concurrency:
      group: doka-publication
      cancel-in-progress: false
      queue: max
    environment:
      # WHY: Every line retains the existing single-maintainer release environment.
      name: nuget
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: write
      id-token: write
      pull-requests: read
    env:
      DOKA_PUBLICATION_LOCK_GROUP: doka-publication
      DOKA_PUBLICATION_LOCK_HELD: "1"
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Publish qualified immutable release
        uses: $/.github/actions/publish-release
        with:
          version: ${{ inputs.version }}
          candidate_artifact_name: ${{ needs.assemble.outputs.candidate_artifact_name }}
          checkpoint_artifact_name: ${{ needs.assemble.outputs.checkpoint_artifact_name }}
          provenance_artifact_name: ${{ needs.attest.outputs.provenance_artifact_name }}
          line_artifact_name: ${{ needs.preflight.outputs.line_artifact_name }}
          nuget_user: ${{ secrets.NUGET_USER }}
