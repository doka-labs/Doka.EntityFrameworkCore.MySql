name: release-candidate

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * 1"

jobs:
  repo-local-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run repo-local release-candidate flow
        run: bash ./eng/release-candidate.sh

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-artifacts
          path: artifacts/release-candidate
