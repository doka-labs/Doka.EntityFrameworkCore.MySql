name: release-candidate

on:
  # A signed tag is the release identity, so the tag push is what starts
  # qualification. Manual dispatch remains available for diagnosis; it can
  # never qualify a release because the trust root below requires the tag.
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# A tag may have only one active qualification run. A second manual dispatch
# waits instead of cancelling a run whose receipts may later be published.
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  # The run ID intentionally excludes github.run_attempt. GitHub preserves the
  # source ref and commit across reruns, so successful stage artifacts from an
  # earlier attempt remain valid inputs to a rerun of only the failed jobs.
  DOKA_RELEASE_CANDIDATE_RUN_ID: github-${{ github.run_id }}
  DOKA_RELEASE_EXPECTED_REF: ${{ github.ref }}
  DOKA_RELEASE_REQUIRE_TAG: 1
  DOKA_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The trust root resolves the qualification check down to the workflow run
    # behind it, which is an Actions resource. An explicit permissions block
    # does not inherit anything, so a job that omits this is refused by the API
    # at the first request rather than at review.
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify immutable source identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release-candidate qualification must be dispatched from a tag." >&2
            exit 1
          fi

          release_tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '${release_tag}' is not a supported semantic version tag." >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/${release_tag}")" != "tag" ]]; then
            echo "Release tag '${release_tag}' must be annotated." >&2
            exit 1
          fi

          if [[ "$(git rev-list -n 1 "refs/tags/${release_tag}")" != "${GITHUB_SHA}" ]]; then
            echo "Release tag '${release_tag}' does not resolve to the checked-out commit." >&2
            exit 1
          fi

      # Fail before any expensive stage if the runner, shell contract, or
      # receipt implementation differs from the reviewed repository state.
      # The trust root runs before any tooling or evidence work. Its checks are
      # seconds long and each answers a question the previous shape left open:
      # who signed the tag, whether its commit ever reached protected main, and
      # whether the branch evidence came from the branch rather than from a
      # pull request against it.
      - name: Establish the release tag trust root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF#refs/tags/}"
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! python3 -m eng.release.trust verify \
              --repo . \
              --tag "${release_tag}" \
              --commit "${GITHUB_SHA}" \
              --repository "${GITHUB_REPOSITORY}" \
              --policy eng/release/evidence-policy.json \
              --output artifacts/release-tag-trust-root.json; then
            message="Sign the tag with a key registered in "
            message+="eng/release/evidence-policy.json, create it on a commit "
            message+="reachable from protected main, and wait for the "
            message+="repository-qualification check to conclude on that "
            message+="branch push before tagging again."
            echo "::error title=Release tag trust root required::${message}" >&2
            exit 1
          fi

      - name: Verify release tooling contracts
        run: |
          bash ./eng/common/verify-dotnet.sh
          bash -n ./eng/release-candidate.sh
          bash -n ./eng/release/restore-release-stage-artifacts.sh
          python3 -m unittest \
            eng.tests.test_materialize_sbom_assets \
            eng.tests.test_release_artifact_resolver \
            eng.tests.test_release_stage_checkpoint \
            eng.tests.test_release_workflow_policy

  foundation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Quality gates and repository tests are commit-exact on the
          # default branch and are imported rather than repeated. Packing
          # stays here because it produces the release payload.
          - stage: package
            timeout_minutes: 25
            deadline_seconds: 1200

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: ${{ matrix.deadline_seconds }}
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/${{ matrix.stage }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ${{ matrix.stage }} stage
        run: bash ./eng/release-candidate.sh --stage "${{ matrix.stage }}"

      - name: Upload verified ${{ matrix.stage }} state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-${{ matrix.stage }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete ${{ matrix.stage }} diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ matrix.stage }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  engine-contracts:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # The specification and integration suites are commit-exact on
          # the default branch and are imported. The gates below are not:
          # both patch matrices resolve a floating dependency leg, and
          # migration and runtime posture compile the tagged provider
          # source, so week-old evidence would not describe this commit.
          - stage: migration-deployment
            timeout_minutes: 60
            deadline_seconds: 3300
          - stage: runtime
            timeout_minutes: 40
            deadline_seconds: 2100
          - stage: efcore-patch-matrix
            timeout_minutes: 120
            deadline_seconds: 6600
          - stage: mysqlconnector-patch-matrix
            timeout_minutes: 45
            deadline_seconds: 2400

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: ${{ matrix.deadline_seconds }}
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/${{ matrix.stage }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ${{ matrix.stage }} stage
        run: bash ./eng/release-candidate.sh --stage "${{ matrix.stage }}"

      - name: Upload verified ${{ matrix.stage }} state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-${{ matrix.stage }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete ${{ matrix.stage }} diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ matrix.stage }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  sbom:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 900
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/sbom

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore package input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/release/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/artifact-selections/sbom-input-artifacts.json" \
            --stage package

      - name: Run SBOM stage
        run: bash ./eng/release-candidate.sh --stage sbom

      - name: Upload verified SBOM state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-sbom-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs:
      - foundation
      - engine-contracts
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 900
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/assemble

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Every required stage is restored by exact workflow-run identity. The
      # helper permits a shared file only when all contributing archives carry
      # identical bytes, then the receipt verifier checks the complete set.
      - name: Restore complete verified stage set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/release/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/artifact-selections/assemble-input-artifacts.json" \
            --stage migration-deployment \
            --stage runtime \
            --stage efcore-patch-matrix \
            --stage mysqlconnector-patch-matrix \
            --stage package \
            --stage sbom

      - name: Assemble immutable release candidate
        env:
          DOKA_RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./eng/release-candidate.sh --stage finalize

      # Assembly verifies the manifest it wrote. This verifies it again from
      # the artifact tree, against the identities this job knows independently,
      # so a manifest that only agrees with itself does not leave the job.
      - name: Verify the canonical qualification manifest
        run: |
          python3 -m eng.release.qualification verify \
            --manifest "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/release-qualification-manifest.json" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-tree-id "$(git rev-parse 'HEAD^{tree}')" \
            --expected-tag "${GITHUB_REF#refs/tags/}"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-artifacts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate
          if-no-files-found: error
          retention-days: 90

      - name: Upload exhaustive stage receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-stage-receipts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate-checkpoints
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write

    steps:
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-artifacts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate

      - name: Download exhaustive stage receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-stage-receipts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate-checkpoints

      - name: Attest packages, evidence, and stage receipts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.nupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.snupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.json
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.sha256
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/*.json

      - name: Verify hosted evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/release-candidate-evidence.json" \
            --repo "${GITHUB_REPOSITORY}"
