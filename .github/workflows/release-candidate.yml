name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

# A tag may have only one active qualification run. A second manual dispatch
# waits instead of cancelling a run whose receipts may later be published.
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  # The run ID intentionally excludes github.run_attempt. GitHub preserves the
  # source ref and commit across reruns, so successful stage artifacts from an
  # earlier attempt remain valid inputs to a rerun of only the failed jobs.
  DOKA_RELEASE_CANDIDATE_RUN_ID: github-${{ github.run_id }}
  DOKA_RELEASE_EXPECTED_REF: ${{ github.ref }}
  DOKA_RELEASE_REQUIRE_TAG: 1
  DOKA_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify immutable source identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release-candidate qualification must be dispatched from a tag." >&2
            exit 1
          fi

          release_tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '${release_tag}' is not a supported semantic version tag." >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/${release_tag}")" != "tag" ]]; then
            echo "Release tag '${release_tag}' must be annotated." >&2
            exit 1
          fi

          if [[ "$(git rev-list -n 1 "refs/tags/${release_tag}")" != "${GITHUB_SHA}" ]]; then
            echo "Release tag '${release_tag}' does not resolve to the checked-out commit." >&2
            exit 1
          fi

      # Fail before any expensive stage if the runner, shell contract, or
      # receipt implementation differs from the reviewed repository state.
      - name: Verify release tooling contracts
        run: |
          bash ./eng/verify-dotnet.sh
          bash -n ./eng/release-candidate.sh
          bash -n ./eng/restore-release-stage-artifacts.sh
          python3 -m unittest \
            eng.tests.test_materialize_sbom_assets \
            eng.tests.test_release_artifact_resolver \
            eng.tests.test_release_stage_checkpoint \
            eng.tests.test_release_workflow_policy

      # Release qualification is compare-only. Resolve the complete hosted
      # runner pair before allocating any build or database matrix runner.
      - name: Verify accepted hosted performance baseline
        run: |
          mkdir -p artifacts
          python3 eng/performance_evidence.py resolve-baseline-mode \
            --contract benchmarks/performance-contract.json \
            --baseline benchmarks/baselines/doka-benchmark-baseline.json \
            --profile scorecard \
            --runner-class github-ubuntu-latest-x64 \
            --requested-mode compare \
            --output artifacts/release-baseline-mode.json

  foundation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: quality
            timeout_minutes: 35
            deadline_seconds: 1800
          - stage: repository-tests
            timeout_minutes: 50
            deadline_seconds: 2700
          - stage: package
            timeout_minutes: 25
            deadline_seconds: 1200

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: ${{ matrix.deadline_seconds }}
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/${{ matrix.stage }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ${{ matrix.stage }} stage
        run: bash ./eng/release-candidate.sh --stage "${{ matrix.stage }}"

      - name: Upload verified ${{ matrix.stage }} state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-${{ matrix.stage }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete ${{ matrix.stage }} diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ matrix.stage }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  engine-contracts:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - stage: specification
            timeout_minutes: 75
            deadline_seconds: 4200
          - stage: integration
            timeout_minutes: 105
            deadline_seconds: 6000
          - stage: migration-deployment
            timeout_minutes: 60
            deadline_seconds: 3300
          - stage: runtime
            timeout_minutes: 40
            deadline_seconds: 2100
          - stage: performance-mysql84
            timeout_minutes: 90
            deadline_seconds: 5100
          - stage: performance-mariadb118
            timeout_minutes: 90
            deadline_seconds: 5100

    env:
      DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: ${{ matrix.deadline_seconds }}
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/${{ matrix.stage }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ${{ matrix.stage }} stage
        run: bash ./eng/release-candidate.sh --stage "${{ matrix.stage }}"

      - name: Upload verified ${{ matrix.stage }} state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-${{ matrix.stage }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain incomplete ${{ matrix.stage }} diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ matrix.stage }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  coverage:
    needs: engine-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 900
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/coverage

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A failed downstream job can be rerun without rerunning successful
      # producers. Resolve the newest immutable receipt for each dependency
      # from this workflow run instead of assuming one shared attempt number.
      - name: Restore coverage inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate-checkpoints/${DOKA_RELEASE_CANDIDATE_RUN_ID}/coverage-input-artifacts.json" \
            --stage repository-tests \
            --stage integration

      - name: Run coverage stage
        run: bash ./eng/release-candidate.sh --stage coverage

      - name: Upload verified coverage state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-coverage-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

  sbom:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    env:
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 900
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/sbom

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore package input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate-checkpoints/${DOKA_RELEASE_CANDIDATE_RUN_ID}/sbom-input-artifacts.json" \
            --stage package

      - name: Run SBOM stage
        run: bash ./eng/release-candidate.sh --stage sbom

      - name: Upload verified SBOM state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-sbom-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs:
      - foundation
      - engine-contracts
      - coverage
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    env:
      DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
      DOKA_RELEASE_CANDIDATE_MAXIMUM_DURATION_SECONDS: 900
      DOKA_RELEASE_CANDIDATE_RESUME: 1
      DOKA_RELEASE_RUNNER_IDENTITY: github/${{ github.run_id }}/assemble

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Every required stage is restored by exact workflow-run identity. The
      # helper permits a shared file only when all contributing archives carry
      # identical bytes, then the receipt verifier checks the complete set.
      - name: Restore complete verified stage set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./eng/restore-release-stage-artifacts.sh \
            --output artifacts \
            --selection-output \
              "artifacts/release-candidate-checkpoints/${DOKA_RELEASE_CANDIDATE_RUN_ID}/assemble-input-artifacts.json" \
            --stage quality \
            --stage repository-tests \
            --stage specification \
            --stage integration \
            --stage migration-deployment \
            --stage runtime \
            --stage coverage \
            --stage package \
            --stage sbom \
            --stage performance-mysql84 \
            --stage performance-mariadb118

      - name: Assemble immutable release candidate
        run: bash ./eng/release-candidate.sh --stage finalize

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-artifacts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate
          if-no-files-found: error
          retention-days: 90

      - name: Upload exhaustive stage receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-stage-receipts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate-checkpoints
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write

    steps:
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-candidate-artifacts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate

      - name: Download exhaustive stage receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-candidate-stage-receipts-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate-checkpoints

      - name: Attest packages, evidence, and stage receipts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.nupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/packages/*.snupkg
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.json
            artifacts/release-candidate/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/release-candidate-evidence.sha256
            artifacts/release-candidate-checkpoints/${{ env.DOKA_RELEASE_CANDIDATE_RUN_ID }}/*.json

      - name: Verify hosted evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "artifacts/release-candidate/${DOKA_RELEASE_CANDIDATE_RUN_ID}/release-candidate-evidence.json" \
            --repo "${GITHUB_REPOSITORY}"
