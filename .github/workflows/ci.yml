name: CI
run-name: ${{ inputs.maintenance && format('maintenance {0}', inputs.schedule_correlation) || github.event.head_commit.message || github.event.pull_request.title || 'CI' }}
# release-line-schedule: {"schemaVersion":1,"producers":["migration-deployment","mysqlconnector-patch-matrix"]}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      maintenance:
        description: Run this branch's scheduled maintenance workload only.
        type: boolean
        default: false
      expected_commit:
        description: Exact branch head resolved by the schedule coordinator.
        type: string
        default: ""
      schedule_correlation:
        description: Immutable coordinator run and attempt identity.
        type: string
        default: ""
  schedule:
    - cron: "15 1 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}-${{ inputs.maintenance && 'maintenance' || 'normal' }}
  cancel-in-progress: true

jobs:
  schedule-identity:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Normal CI remains nonpublishing and unrestricted
        if: ${{ !inputs.maintenance }}
        run: echo "Normal CI does not grant release authority."
      - name: Checkout branch-native maintenance guard
        if: inputs.maintenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact active maintenance producer
        if: inputs.maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SCHEDULE_CORRELATION: ${{ inputs.schedule_correlation }}
        run: >-
          python3 eng/release/schedules.py validate-child --workflow ci.yml
          --expected-commit "${EXPECTED_COMMIT}" --correlation "${SCHEDULE_CORRELATION}"

  scheduled-release-lines:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout schedule authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch and await each active branch-native producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/schedules.py run --workflow ci.yml --output artifacts/release-lines/schedule-ci.json
      - name: Upload exact scheduled child evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-line-schedule-ci
          path: artifacts/release-lines/schedule-ci.json
          if-no-files-found: warn

  migration-deployment:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.maintenance)
    needs: schedule-identity
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify migration deployment lifecycle
        run: bash eng/test-migration-deployment.sh

      - name: Upload migration deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-deployment-evidence
          path: artifacts/migration-deployment

  mysqlconnector-patch-matrix:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.maintenance)
    needs: schedule-identity
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - mysqlconnector-version: "2.6.1"
            resolved-version-pattern: '^2[.]6[.]1$'
            artifact-suffix: minimum-2-6-1
          - mysqlconnector-version: "2.*"
            resolved-version-pattern: '^2[.][0-9]+[.][0-9]+$'
            artifact-suffix: latest-2-x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run MySqlConnector driver contract
        env:
          DOKA_MYSQLCONNECTOR_VERSION: ${{ matrix.mysqlconnector-version }}
          DOKA_MYSQLCONNECTOR_RESOLVED_PATTERN: ${{ matrix.resolved-version-pattern }}
          DOKA_MYSQLCONNECTOR_ARTIFACT_SUFFIX: ${{ matrix.artifact-suffix }}
          DOKA_INTEGRATION_TARGETS: mysql84,mariadb118
        run: bash ./eng/testing/test-mysqlconnector-matrix.sh

      - name: Upload MySqlConnector patch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysqlconnector-${{ matrix.artifact-suffix }}
          path: artifacts/mysqlconnector-patch-matrix/${{ matrix.artifact-suffix }}

  # Specification conformance moved into the per-event lane when the repository
  # became public and standard runners stopped consuming a minute allowance.
  # It detects provider regressions on the change that introduces them, which
  # the weekly cadence could only surface days later.
  qualification:
    if: github.event_name != 'schedule' && !inputs.maintenance
    needs: schedule-identity
    uses: $/.github/workflows/quality-gates.yml
    permissions:
      actions: read
      contents: read

  repository-qualification:
    if: always() && github.event_name != 'schedule' && !inputs.maintenance
    needs: [schedule-identity, qualification]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout the tested source and aggregate contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every commit-exact gate to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: bash eng/quality/require-qualification.sh schedule-identity qualification

      - name: Record tested pull-request merge tree
        if: github.event_name == 'pull_request'
        id: repository-qualification
        env:
          DOKA_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          DOKA_QUALIFIED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          expected_ref="refs/pull/${DOKA_PULL_REQUEST_NUMBER}/merge"
          qualified_commit="$(git rev-parse HEAD)"
          qualified_tree="$(git rev-parse 'HEAD^{tree}')"

          test "${DOKA_QUALIFIED_REF}" = "${expected_ref}"
          test "${qualified_commit}" = "${GITHUB_SHA}"
          echo "tree=${qualified_tree}" >> "${GITHUB_OUTPUT}"

          mkdir -p artifacts/repository-qualification
          printf '%s\n' "${qualified_tree}" \
            > artifacts/repository-qualification/qualified-tree.txt

      - name: Upload tested pull-request merge tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stage-repository-qualification-${{ steps.repository-qualification.outputs.tree }}-attempt-${{ github.run_attempt }}
          path: artifacts/repository-qualification/qualified-tree.txt
          if-no-files-found: error
          retention-days: 30
