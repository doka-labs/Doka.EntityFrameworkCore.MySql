name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Doka.EntityFrameworkCore.MySql.slnx --tl:off

      - name: Validate architecture decisions
        run: bash eng/validate-adrs.sh

      - name: Verify formatting
        run: dotnet format Doka.EntityFrameworkCore.MySql.slnx --verify-no-changes --no-restore

      - name: Verify unnecessary usings
        run: |
          dotnet format Doka.EntityFrameworkCore.MySql.slnx style \
            --diagnostics IDE0005 --severity hidden \
            --verify-no-changes --no-restore

      - name: Vulnerability audit (runtime provider)
        run: |
          mkdir -p artifacts/ci-audit
          dotnet package list \
            --project src/Doka.EntityFrameworkCore.MySql/Doka.EntityFrameworkCore.MySql.csproj \
            --vulnerable --include-transitive --format json \
            > artifacts/ci-audit/runtime.json
          count="$(bash eng/check-vulnerability-audit.sh artifacts/ci-audit/runtime.json)"
          if [[ "${count}" -ne 0 ]]; then
            echo "Vulnerability audit failed for runtime provider." >&2
            exit 1
          fi

      - name: Vulnerability audit (NetTopologySuite)
        run: |
          dotnet package list \
            --project src/Doka.EntityFrameworkCore.MySql.NetTopologySuite/Doka.EntityFrameworkCore.MySql.NetTopologySuite.csproj \
            --vulnerable --include-transitive --format json \
            > artifacts/ci-audit/spatial.json
          count="$(bash eng/check-vulnerability-audit.sh artifacts/ci-audit/spatial.json)"
          if [[ "${count}" -ne 0 ]]; then
            echo "Vulnerability audit failed for NetTopologySuite package." >&2
            exit 1
          fi

      - name: Verify example projects build
        run: |
          # Standalone example projects are not part of the .slnx and therefore
          # not covered by the top-level restore, so let each build restore its
          # own packages. The NuGet cache is already warm from the slnx restore,
          # which keeps per-example restore near-instant.
          failed=0
          for csproj in examples/*/*.csproj; do
            if ! dotnet build "${csproj}" --tl:off -m:1 > /dev/null 2>&1; then
              echo "FAIL: ${csproj}" >&2
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more example projects failed to build." >&2
            exit 1
          fi
          echo "All example projects build successfully."

      - name: Verify migration model snapshot
        run: bash eng/check-migration-model.sh

  migration-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Verify migration deployment lifecycle
        run: bash eng/test-migration-deployment.sh

      - name: Upload migration deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-deployment-evidence
          path: artifacts/migration-deployment

  repo-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run repo-local test path
        run: bash ./eng/test.sh

      - name: Upload coverage and test-result artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-tests-coverage
          path: artifacts/coverage

  # EfCorePatchMatrixCI (Backbone-9 / ADR D-009): runs the repo-local test path
  # against the lower bound of the EF Core 10.0.x patch range plus the latest
  # floating 10.0.x tag, so a future Microsoft patch that breaks our EF1001
  # surface surfaces in CI within one nightly cycle rather than at consumer-
  # install time.
  efcore-patch-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ef-core-version: "10.0.8"
            resolved-version-pattern: '^10[.]0[.]8$'
            artifact-suffix: minimum-10-0-8
          - ef-core-version: "10.0.*"
            resolved-version-pattern: '^10[.]0[.][0-9]+$'
            artifact-suffix: latest-10-0

    env:
      DokaEfCoreVersion: ${{ matrix.ef-core-version }}
      CentralPackageFloatingVersionsEnabled: true
      DOKA_EF_CORE_RESOLVED_PATTERN: ${{ matrix.resolved-version-pattern }}
      DOKA_EF_CORE_ARTIFACT_SUFFIX: ${{ matrix.artifact-suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore against requested EF Core patch
        run: dotnet restore Doka.EntityFrameworkCore.MySql.slnx --tl:off

      - name: Assert and record resolved EF Core patch
        run: |
          evidence_dir="artifacts/efcore-patch-matrix/${DOKA_EF_CORE_ARTIFACT_SUFFIX}"
          mkdir -p "${evidence_dir}"
          dotnet package list \
            --project Doka.EntityFrameworkCore.MySql.slnx \
            --include-transitive \
            --format json \
            --no-restore > "${evidence_dir}/resolved-packages.json"
          jq -e --arg pattern "${DOKA_EF_CORE_RESOLVED_PATTERN}" '
            [
              .projects[].frameworks[].topLevelPackages[]?
              | select(
                  .id == "Microsoft.EntityFrameworkCore.Design"
                  or .id == "Microsoft.EntityFrameworkCore.Relational"
                  or .id == "Microsoft.EntityFrameworkCore.Relational.Specification.Tests"
                )
            ] as $packages
            | ($packages | length) >= 3
              and ($packages | map(.resolvedVersion) | unique | length) == 1
              and ($packages | all(.resolvedVersion | test($pattern)))
          ' "${evidence_dir}/resolved-packages.json"
          jq -r '
            .projects[].frameworks[].topLevelPackages[]?
            | select(
                .id == "Microsoft.EntityFrameworkCore.Design"
                or .id == "Microsoft.EntityFrameworkCore.Relational"
                or .id == "Microsoft.EntityFrameworkCore.Relational.Specification.Tests"
              )
            | "\(.id) requested=\(.requestedVersion) resolved=\(.resolvedVersion)"
          ' "${evidence_dir}/resolved-packages.json" | sort -u

      - name: Run repo-local test path against pinned EF Core
        run: bash ./eng/test.sh

      - name: Run specification and live suite against MySQL 8.4
        env:
          DOKA_SPEC_TEST_TARGET: mysql84
          DOKA_TEST_DATABASE_EVIDENCE_FILE: ${{ github.workspace }}/artifacts/efcore-patch-matrix/${{ matrix.artifact-suffix }}/mysql84/test-database-evidence.json
        run: |
          dotnet test tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj \
            --configuration Release --no-build --no-restore --tl:off \
            --filter "Category=Spec|Category=Live" \
            --logger trx \
            --results-directory artifacts/efcore-patch-matrix/${DOKA_EF_CORE_ARTIFACT_SUFFIX}/mysql84
          bash ./eng/check-spec-results.sh \
            mysql84 \
            artifacts/efcore-patch-matrix/${DOKA_EF_CORE_ARTIFACT_SUFFIX}/mysql84

      - name: Run specification and live suite against MariaDB 11.8
        env:
          DOKA_SPEC_TEST_TARGET: mariadb118
          DOKA_TEST_DATABASE_EVIDENCE_FILE: ${{ github.workspace }}/artifacts/efcore-patch-matrix/${{ matrix.artifact-suffix }}/mariadb118/test-database-evidence.json
        run: |
          dotnet test tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj \
            --configuration Release --no-build --no-restore --tl:off \
            --filter "Category=Spec|Category=Live" \
            --logger trx \
            --results-directory artifacts/efcore-patch-matrix/${DOKA_EF_CORE_ARTIFACT_SUFFIX}/mariadb118
          bash ./eng/check-spec-results.sh \
            mariadb118 \
            artifacts/efcore-patch-matrix/${DOKA_EF_CORE_ARTIFACT_SUFFIX}/mariadb118

      - name: Run representative live integration matrix
        env:
          DOKA_INTEGRATION_TARGETS: mysql84,mariadb118
        run: bash ./eng/test-integration.sh

      - name: Upload EF Core patch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: efcore-patch-${{ matrix.artifact-suffix }}
          path: |
            artifacts/efcore-patch-matrix/${{ matrix.artifact-suffix }}
            artifacts/integration

  spec-test-suite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine:
          - { name: mysql84, target: "mysql84" }
          - { name: mariadb114, target: "mariadb114" }
          - { name: mariadb118, target: "mariadb118" }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore + build FunctionalTests
        run: |
          dotnet restore eng/Doka.EntityFrameworkCore.MySql.SpecificationContract/Doka.EntityFrameworkCore.MySql.SpecificationContract.csproj --tl:off
          dotnet restore tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj --tl:off
          dotnet build eng/Doka.EntityFrameworkCore.MySql.SpecificationContract/Doka.EntityFrameworkCore.MySql.SpecificationContract.csproj --configuration Release --no-restore --tl:off
          dotnet build tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj --configuration Release --no-restore --tl:off

      - name: Verify specification disposition contract and discovery
        run: |
          bash ./eng/check-spec-contract.sh
          dotnet test tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj \
            --configuration Release --no-build --no-restore --tl:off \
            --filter FullyQualifiedName~SpecDispositionContractTests
          bash ./eng/check-spec-discovery.sh

      - name: Run specification suite against ${{ matrix.engine.name }}
        env:
          DOKA_SPEC_TEST_TARGET: ${{ matrix.engine.target }}
          DOKA_TEST_DATABASE_EVIDENCE_FILE: ${{ github.workspace }}/artifacts/spec-tests/${{ matrix.engine.name }}/test-database-evidence.json
        run: |
          dotnet test tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj \
            --configuration Release --no-build --no-restore --tl:off \
            --filter "Category=Spec" \
            --collect:"XPlat Code Coverage" \
            --logger trx \
            --results-directory artifacts/spec-tests/${{ matrix.engine.name }}
          bash ./eng/check-spec-results.sh \
            ${{ matrix.engine.target }} \
            artifacts/spec-tests/${{ matrix.engine.name }}

      - name: Upload spec coverage and test-result artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-tests-coverage-${{ matrix.engine.name }}
          path: artifacts/spec-tests/${{ matrix.engine.name }}

  coverage-gate:
    runs-on: ubuntu-latest
    needs: [repo-tests, spec-test-suite, integration-smoke]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download repo-tests coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: repo-tests-coverage
          path: artifacts/coverage/repo-tests

      - name: Download mysql84 spec coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spec-tests-coverage-mysql84
          path: artifacts/coverage/spec-mysql84

      - name: Download mariadb118 spec coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spec-tests-coverage-mariadb118
          path: artifacts/coverage/spec-mariadb118

      - name: Download mariadb114 spec coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spec-tests-coverage-mariadb114
          path: artifacts/coverage/spec-mariadb114

      - name: Download integration coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: integration-smoke-coverage
          path: artifacts/coverage/integration

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Merge cobertura reports into a single union report
        run: bash ./eng/merge-coverage.sh artifacts/coverage artifacts/coverage-merged

      - name: Enforce coverage threshold
        run: bash ./eng/check-coverage-threshold.sh artifacts/coverage-merged

  integration-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run representative dual-engine live integration path
        env:
          DOKA_INTEGRATION_TARGETS: mysql84,mariadb118
        run: bash ./eng/test-integration.sh

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-smoke-coverage
          path: artifacts/coverage/integration

  runtime-posture:
    runs-on: ubuntu-latest

    services:
      mysql84:
        image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: doka_provider
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Run runtime posture smoke
        run: bash ./eng/test-runtime-posture.sh --test-only

  benchmark-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark-target:
          - mysql84
          - mariadb118

    services:
      mysql84:
        image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: benchmark_suite
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb118:
        image: mariadb:11.8.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: benchmark_suite
          MARIADB_USER: doka
          MARIADB_PASSWORD: doka_password
        ports:
          - 33069:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run benchmark smoke
        env:
          DOKA_BENCHMARK_PROFILE: smoke
          DOKA_BENCHMARK_TARGET: ${{ matrix.benchmark-target }}
        run: bash ./eng/benchmark.sh --test-only
