name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Doka.EntityFrameworkCore.MySql.slnx --tl:off

      - name: Verify formatting
        run: dotnet format Doka.EntityFrameworkCore.MySql.slnx --verify-no-changes --no-restore

      - name: Vulnerability audit (runtime provider)
        run: |
          mkdir -p artifacts/ci-audit
          dotnet package list \
            --project src/Doka.EntityFrameworkCore.MySql/Doka.EntityFrameworkCore.MySql.csproj \
            --vulnerable --include-transitive --format json \
            > artifacts/ci-audit/runtime.json
          count="$(bash eng/check-vulnerability-audit.sh artifacts/ci-audit/runtime.json)"
          if [[ "${count}" -ne 0 ]]; then
            echo "Vulnerability audit failed for runtime provider." >&2
            exit 1
          fi

      - name: Vulnerability audit (NetTopologySuite)
        run: |
          dotnet package list \
            --project src/Doka.EntityFrameworkCore.MySql.NetTopologySuite/Doka.EntityFrameworkCore.MySql.NetTopologySuite.csproj \
            --vulnerable --include-transitive --format json \
            > artifacts/ci-audit/spatial.json
          count="$(bash eng/check-vulnerability-audit.sh artifacts/ci-audit/spatial.json)"
          if [[ "${count}" -ne 0 ]]; then
            echo "Vulnerability audit failed for NetTopologySuite package." >&2
            exit 1
          fi

      - name: Verify example projects build
        run: |
          # Standalone example projects are not part of the .slnx and therefore
          # not covered by the top-level restore, so let each build restore its
          # own packages. The NuGet cache is already warm from the slnx restore,
          # which keeps per-example restore near-instant.
          failed=0
          for csproj in examples/*/*.csproj; do
            if ! dotnet build "${csproj}" --tl:off -m:1 > /dev/null 2>&1; then
              echo "FAIL: ${csproj}" >&2
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more example projects failed to build." >&2
            exit 1
          fi
          echo "All example projects build successfully."

  repo-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run repo-local test path
        run: bash ./eng/test.sh

      - name: Upload coverage and test-result artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-tests-coverage
          path: artifacts/coverage

  # EfCorePatchMatrixCI (Backbone-9 / ADR D-009): runs the repo-local test path
  # against the lower bound of the EF Core 10.0.x patch range plus the latest
  # floating 10.0.x tag, so a future Microsoft patch that breaks our EF1001
  # surface surfaces in CI within one nightly cycle rather than at consumer-
  # install time.
  efcore-patch-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ef-core-version:
          - "10.0.4"
          - "10.0.*"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Override EF Core version
        env:
          EF_CORE_VERSION: ${{ matrix.ef-core-version }}
        run: |
          sed -i.bak \
            -e "s|<PackageVersion Include=\"Microsoft.EntityFrameworkCore.Design\" Version=\"\[10.0.4, 10.1.0)\" />|<PackageVersion Include=\"Microsoft.EntityFrameworkCore.Design\" Version=\"${EF_CORE_VERSION}\" />|" \
            -e "s|<PackageVersion Include=\"Microsoft.EntityFrameworkCore.Relational\" Version=\"\[10.0.4, 10.1.0)\" />|<PackageVersion Include=\"Microsoft.EntityFrameworkCore.Relational\" Version=\"${EF_CORE_VERSION}\" />|" \
            -e "s|<PackageVersion Include=\"Microsoft.EntityFrameworkCore.Relational.Specification.Tests\" Version=\"\[10.0.4, 10.1.0)\" />|<PackageVersion Include=\"Microsoft.EntityFrameworkCore.Relational.Specification.Tests\" Version=\"${EF_CORE_VERSION}\" />|" \
            Directory.Packages.props
          rm -f Directory.Packages.props.bak

      - name: Run repo-local test path against pinned EF Core
        run: bash ./eng/test.sh

  spec-test-suite:
    runs-on: ubuntu-latest

    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: doka_provider
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb118:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: doka_provider
          MARIADB_USER: doka
          MARIADB_PASSWORD: doka_password
        ports:
          - 33069:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        engine:
          - { name: mysql84, token: "mysql:8.4", port: "33068" }
          - { name: mariadb118, token: "mariadb:11.8", port: "33069" }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore + build FunctionalTests
        run: |
          dotnet restore tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj --tl:off
          dotnet build tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj --configuration Release --no-restore --tl:off

      - name: Run specification suite against ${{ matrix.engine.name }}
        env:
          DOKA_SPEC_TEST_CONNECTION_STRING: "Server=127.0.0.1;Port=${{ matrix.engine.port }};User ID=root;Password=root_password;Persist Security Info=True;"
          DOKA_SPEC_TEST_SERVER_VERSION: ${{ matrix.engine.token }}
        # The first specification runs ship with infrastructure only; the failing-test triage is
        # tracked in tests/.../Specification/SkipList.md per ADR D-011. Allow continue-on-error so
        # the suite surfaces every failure for triage instead of stopping at the first one.
        continue-on-error: true
        run: |
          dotnet test tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj \
            --configuration Release --no-build --no-restore --tl:off \
            --filter "Category=Spec" \
            --collect:"XPlat Code Coverage" \
            --logger trx \
            --results-directory artifacts/spec-tests/${{ matrix.engine.name }}

      - name: Upload spec coverage and test-result artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-tests-coverage-${{ matrix.engine.name }}
          path: artifacts/spec-tests/${{ matrix.engine.name }}

  coverage-gate:
    runs-on: ubuntu-latest
    needs: [repo-tests, spec-test-suite]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download repo-tests coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: repo-tests-coverage
          path: artifacts/coverage/repo-tests

      - name: Download mysql84 spec coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spec-tests-coverage-mysql84
          path: artifacts/coverage/spec-mysql84
        continue-on-error: true

      - name: Download mariadb118 spec coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spec-tests-coverage-mariadb118
          path: artifacts/coverage/spec-mariadb118
        continue-on-error: true

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Merge cobertura reports into a single union report
        # check-coverage-threshold.sh sums lines-valid / lines-covered across
        # input files, which double-counts when N cobertura files describe the
        # SAME source package. ReportGenerator merges into one Cobertura.xml
        # with per-line dedup so the gate measures the true union.
        run: |
          reportgenerator \
            -reports:"artifacts/coverage/**/coverage.cobertura.xml" \
            -targetdir:artifacts/coverage-merged \
            -reporttypes:Cobertura
          # ReportGenerator emits Cobertura.xml; rename so the threshold
          # script's `find -name 'coverage.cobertura.xml'` finds it.
          mv artifacts/coverage-merged/Cobertura.xml \
            artifacts/coverage-merged/coverage.cobertura.xml

      - name: Enforce coverage threshold
        env:
          DOKA_COVERAGE_LINE_THRESHOLD: "47"
          DOKA_COVERAGE_BRANCH_THRESHOLD: "38"
        run: bash ./eng/check-coverage-threshold.sh artifacts/coverage-merged

  integration-smoke:
    runs-on: ubuntu-latest

    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: doka_provider
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb118:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: doka_provider
          MARIADB_USER: doka
          MARIADB_PASSWORD: doka_password
        ports:
          - 33069:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run representative dual-engine live integration path
        env:
          DOKA_INTEGRATION_TARGETS: mysql84,mariadb118
          # Root credentials for throwaway CI containers. Matches the documented
          # IntegrationTestEnvironment default so tests that need CREATE/DROP DATABASE
          # (EnsureCreatedAsync/EnsureDeletedAsync round-trips) succeed without
          # per-test privilege gymnastics.
          DOKA_MYSQL84_CONNECTION_STRING: Server=127.0.0.1;Port=33068;Database=doka_provider;User ID=root;Password=root_password;Persist Security Info=True;
          DOKA_MARIADB118_CONNECTION_STRING: Server=127.0.0.1;Port=33069;Database=doka_provider;User ID=root;Password=root_password;Persist Security Info=True;
        run: bash ./eng/test-integration.sh --test-only

  runtime-posture:
    runs-on: ubuntu-latest

    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: doka_provider
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Run runtime posture smoke
        run: bash ./eng/test-runtime-posture.sh --test-only

  benchmark-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark-target:
          - mysql84
          - mariadb118

    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: benchmark_suite
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb118:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: benchmark_suite
          MARIADB_USER: doka
          MARIADB_PASSWORD: doka_password
        ports:
          - 33069:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run benchmark smoke
        env:
          DOKA_BENCHMARK_PROFILE: smoke
          DOKA_BENCHMARK_TARGET: ${{ matrix.benchmark-target }}
        run: bash ./eng/benchmark.sh --test-only
