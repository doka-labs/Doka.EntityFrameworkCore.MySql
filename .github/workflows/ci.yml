name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Select the trusted CI profile to execute.
        required: true
        default: full
        type: choice
        options:
          - full
          - baseline-proposal
  schedule:
    - cron: "15 1 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run repository quality gates
        run: bash eng/quality-gates.sh

  migration-deployment:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && inputs.profile != 'baseline-proposal')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify migration deployment lifecycle
        run: bash eng/test-migration-deployment.sh

      - name: Upload migration deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-deployment-evidence
          path: artifacts/migration-deployment

  repo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run repo-local test path
        run: bash ./eng/test.sh

      - name: Upload coverage and test-result artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-tests-coverage
          path: artifacts/coverage

  # ADR D-009: runs the repo-local test path against the lower bound of the EF
  # Core 10.0.x patch range plus the latest floating 10.0.x tag, so a Microsoft
  # patch that breaks the EF1001 surface is detected on the scheduled cycle
  # rather than at consumer-install time. Package resolution is deliberately
  # uncached here because resolution is the property under test.
  efcore-patch-matrix:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && inputs.profile != 'baseline-proposal')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - ef-core-version: "10.0.8"
            resolved-version-pattern: '^10[.]0[.]8$'
            artifact-suffix: minimum-10-0-8
          - ef-core-version: "10.0.*"
            resolved-version-pattern: '^10[.]0[.][0-9]+$'
            artifact-suffix: latest-10-0

    env:
      DokaEfCoreVersion: ${{ matrix.ef-core-version }}
      CentralPackageFloatingVersionsEnabled: true
      DOKA_EF_CORE_RESOLVED_PATTERN: ${{ matrix.resolved-version-pattern }}
      DOKA_EF_CORE_ARTIFACT_SUFFIX: ${{ matrix.artifact-suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run EF Core patch matrix row
        run: bash ./eng/testing/test-efcore-matrix.sh

      - name: Upload EF Core patch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: efcore-patch-${{ matrix.artifact-suffix }}
          path: |
            artifacts/efcore-patch-matrix/${{ matrix.artifact-suffix }}
            artifacts/integration

  mysqlconnector-patch-matrix:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && inputs.profile != 'baseline-proposal')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - mysqlconnector-version: "2.5.0"
            resolved-version-pattern: '^2[.]5[.]0$'
            artifact-suffix: minimum-2-5-0
          - mysqlconnector-version: "2.*"
            resolved-version-pattern: '^2[.][0-9]+[.][0-9]+$'
            artifact-suffix: latest-2-x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run MySqlConnector driver contract
        env:
          DOKA_MYSQLCONNECTOR_VERSION: ${{ matrix.mysqlconnector-version }}
          DOKA_MYSQLCONNECTOR_RESOLVED_PATTERN: ${{ matrix.resolved-version-pattern }}
          DOKA_MYSQLCONNECTOR_ARTIFACT_SUFFIX: ${{ matrix.artifact-suffix }}
          DOKA_INTEGRATION_TARGETS: mysql84,mariadb118
        run: bash ./eng/testing/test-mysqlconnector-matrix.sh

      - name: Upload MySqlConnector patch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysqlconnector-${{ matrix.artifact-suffix }}
          path: artifacts/mysqlconnector-patch-matrix/${{ matrix.artifact-suffix }}

  # Specification conformance moved into the per-event lane when the repository
  # became public and standard runners stopped consuming a minute allowance.
  # It detects provider regressions on the change that introduces them, which
  # the weekly cadence could only surface days later.
  spec-test-suite:
    # An explicit name keeps the status-check identity stable and readable;
    # the generated form would repeat every matrix value.
    name: spec-test-suite (${{ matrix.engine.name }})
    if: inputs.profile != 'baseline-proposal'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        engine:
          - { name: mysql84, target: "mysql84" }
          - { name: mysql97, target: "mysql97" }
          - { name: mariadb1011, target: "mariadb1011" }
          - { name: mariadb114, target: "mariadb114" }
          - { name: mariadb118, target: "mariadb118" }
          - { name: mariadb123, target: "mariadb123" }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore + build FunctionalTests
        run: |
          dotnet restore eng/tools/Doka.EntityFrameworkCore.MySql.SpecificationContract/Doka.EntityFrameworkCore.MySql.SpecificationContract.csproj --tl:off
          dotnet restore tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj --tl:off
          dotnet build eng/tools/Doka.EntityFrameworkCore.MySql.SpecificationContract/Doka.EntityFrameworkCore.MySql.SpecificationContract.csproj --configuration Release --no-restore --tl:off
          dotnet build tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj --configuration Release --no-restore --tl:off

      - name: Verify specification disposition contract and discovery
        if: matrix.engine.name == 'mysql84'
        run: |
          bash ./eng/testing/check-spec-contract.sh
          dotnet test tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj \
            --configuration Release --no-build --no-restore --tl:off \
            --filter FullyQualifiedName~SpecDispositionContractTests
          bash ./eng/testing/check-spec-discovery.sh

      - name: Run specification suite against ${{ matrix.engine.name }}
        env:
          DOKA_SPEC_TEST_TARGET: ${{ matrix.engine.target }}
          DOKA_TEST_DATABASE_EVIDENCE_FILE: ${{ github.workspace }}/artifacts/spec-tests/${{ matrix.engine.name }}/test-database-evidence.json
        run: |
          dotnet test tests/Doka.EntityFrameworkCore.MySql.FunctionalTests/Doka.EntityFrameworkCore.MySql.FunctionalTests.csproj \
            --configuration Release --no-build --no-restore --tl:off \
            --filter "Category=Spec|Category=Live" \
            --collect:"XPlat Code Coverage" \
            --logger trx \
            --results-directory artifacts/spec-tests/${{ matrix.engine.name }}
          bash ./eng/testing/check-spec-results.sh \
            ${{ matrix.engine.target }} \
            artifacts/spec-tests/${{ matrix.engine.name }}

      - name: Upload spec coverage and test-result artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-tests-coverage-${{ matrix.engine.name }}
          path: artifacts/spec-tests/${{ matrix.engine.name }}

  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [repo-tests, spec-test-suite, integration-smoke]
    if: inputs.profile != 'baseline-proposal'

    steps:
      # A merged report assembled from a failed producer measures a partial
      # test run. Without this assertion the gate can report a met coverage
      # floor for a run whose tests never finished.
      - name: Require successful coverage producers
        env:
          INTEGRATION_RESULT: ${{ needs.integration-smoke.result }}
          REPO_TESTS_RESULT: ${{ needs.repo-tests.result }}
          SPEC_RESULT: ${{ needs.spec-test-suite.result }}
        run: |
          failed=0
          for entry in \
            "repo-tests=${REPO_TESTS_RESULT}" \
            "spec-test-suite=${SPEC_RESULT}" \
            "integration-smoke=${INTEGRATION_RESULT}"; do
            if [[ "${entry#*=}" != "success" ]]; then
              echo "Coverage producer ${entry%%=*} reported '${entry#*=}'." >&2
              failed=1
            fi
          done

          if [[ "${failed}" -ne 0 ]]; then
            echo "Coverage cannot be evaluated against incomplete evidence." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download repo-tests coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo-tests-coverage
          path: artifacts/coverage/repo-tests

      - name: Download mysql84 spec coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tests-coverage-mysql84
          path: artifacts/coverage/spec-mysql84

      - name: Download mysql97 spec coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tests-coverage-mysql97
          path: artifacts/coverage/spec-mysql97

      - name: Download mariadb1011 spec coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tests-coverage-mariadb1011
          path: artifacts/coverage/spec-mariadb1011

      - name: Download mariadb118 spec coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tests-coverage-mariadb118
          path: artifacts/coverage/spec-mariadb118

      - name: Download mariadb114 spec coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tests-coverage-mariadb114
          path: artifacts/coverage/spec-mariadb114

      - name: Download mariadb123 spec coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tests-coverage-mariadb123
          path: artifacts/coverage/spec-mariadb123

      - name: Download integration coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-smoke-coverage
          path: artifacts/coverage/integration

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Merge cobertura reports into a single union report
        run: bash ./eng/quality/merge-coverage.sh artifacts/coverage artifacts/coverage-merged

      - name: Enforce coverage threshold
        run: bash ./eng/quality/check-coverage-threshold.sh artifacts/coverage-merged

  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run representative dual-engine live integration path
        env:
          DOKA_INTEGRATION_TARGETS: mysql84,mariadb118
          DOKA_INTEGRATION_TEST_FILTER: "VerificationLane!=FullIntegration"
        run: bash ./eng/test-integration.sh

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-smoke-coverage
          path: artifacts/coverage/integration

  runtime-posture:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && inputs.profile != 'baseline-proposal')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql84:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: doka_provider
          MYSQL_USER: doka
          MYSQL_PASSWORD: doka_password
        ports:
          - 33068:3306
        options: >-
          --health-cmd="MYSQL_PWD=root_password mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install NativeAOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Run runtime posture smoke
        env:
          DOKA_RUNTIME_TARGET_IMAGE: >-
            mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        run: bash ./eng/test-runtime-posture.sh --test-only

  # The required status check for the protected branch. It exists because
  # GitHub treats a conditionally skipped job as successful and skips the
  # dependents of a failed one, so a required check that merely depended on the
  # gates below would report success in exactly the cases it must catch. Running
  # with always() and inspecting each result explicitly is what makes the check
  # mean what its name says.
  repository-qualification:
    # The baseline-proposal dispatch runs none of the gates below, so this
    # check has nothing to aggregate and would report failure on every such
    # run. Skipping is safe here and only here: a skipped job counts as
    # success to branch protection, but this profile is reachable only by
    # workflow_dispatch, and the release trust root accepts qualification
    # evidence only when the producing run's event was a push. A skipped
    # aggregator on a dispatch can therefore never be imported as evidence.
    if: >-
      always()
      && (github.event_name != 'workflow_dispatch'
      || inputs.profile != 'baseline-proposal')
    needs:
      - quality-gates
      - repo-tests
      - spec-test-suite
      - integration-smoke
      - coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Require every commit-exact gate to have succeeded
        env:
          RESULTS: >-
            quality-gates=${{ needs.quality-gates.result }}
            repo-tests=${{ needs.repo-tests.result }}
            spec-test-suite=${{ needs.spec-test-suite.result }}
            integration-smoke=${{ needs.integration-smoke.result }}
            coverage-gate=${{ needs.coverage-gate.result }}
        run: |
          status=0
          for entry in ${RESULTS}; do
            gate="${entry%%=*}"
            result="${entry##*=}"
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Repository qualification::${gate} concluded '${result}'."
              status=1
            else
              echo "${gate}: success"
            fi
          done
          exit "${status}"

  benchmark-smoke:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && inputs.profile != 'baseline-proposal')
    uses: ./.github/workflows/benchmark-smoke.yml
    permissions:
      contents: read
