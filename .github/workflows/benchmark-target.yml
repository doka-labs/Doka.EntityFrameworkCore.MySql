name: benchmark-target

# This internal workflow owns one target's complete evidence lifecycle. It is
# reusable only so the scorecard can fan out the contract-derived target matrix;
# it deliberately has no dispatch trigger and adds no maintainer-facing action.
on:
  workflow_call:
    inputs:
      target:
        description: A key from performance-contract.json requiredTargets.
        required: true
        type: string
      comparison_mode:
        description: Paired comparison or historical baseline seeding.
        required: true
        type: string

permissions:
  contents: read

jobs:
  attempt-1:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      retry: ${{ steps.receipt.outputs.retry }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A paired comparison packs the provider from its reference commit.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve immutable attempt identity
        id: identity
        env:
          COMPARISON_MODE: ${{ inputs.comparison_mode }}
          DISPATCH_PROFILE: scorecard
          TARGET: ${{ inputs.target }}
        run: |
          echo "run-id=github-${GITHUB_RUN_ID}-${TARGET}-attempt-1" >> "${GITHUB_OUTPUT}"
          source_hash="$(python3 -m eng.performance.cli source-hash --repo .)"
          echo "source-hash=${source_hash}" >> "${GITHUB_OUTPUT}"
          attempt_profile="$(
            python3 -m eng.performance.cli attempt-profile \
              --contract benchmarks/performance-contract.json \
              --profile "${DISPATCH_PROFILE}" \
              --comparison-mode "${COMPARISON_MODE}"
          )"
          echo "attempt-profile=${attempt_profile}" >> "${GITHUB_OUTPUT}"

      # The raw exit is recorded as evidence. Only typed environment or
      # measurement interruption may authorize the independent-runner retry.
      - name: Run scorecard attempt 1
        id: benchmark
        env:
          DOKA_BENCHMARK_PROFILE: scorecard
          DOKA_BENCHMARK_BASELINE_MODE: ${{ inputs.comparison_mode == 'historical' && 'seed' || 'compare' }}
          DOKA_BENCHMARK_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
          DOKA_BENCHMARK_TARGET: ${{ inputs.target }}
          DOKA_BENCHMARK_RUN_ID: ${{ steps.identity.outputs.run-id }}
          DOKA_BENCHMARK_COMMIT: ${{ github.sha }}
          DOKA_BENCHMARK_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
        run: |
          set +e
          bash ./eng/benchmark.sh --up-run-down
          exit_code=$?
          set -e
          echo "exit-code=${exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Record attempt 1
        id: receipt
        env:
          ATTEMPT_COMMIT: ${{ github.sha }}
          ATTEMPT_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          ATTEMPT_PROFILE: ${{ steps.identity.outputs.attempt-profile }}
          ATTEMPT_EXIT_CODE: ${{ steps.benchmark.outputs.exit-code }}
          ATTEMPT_RUN_ID: ${{ steps.identity.outputs.run-id }}
          ATTEMPT_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
          TARGET: ${{ inputs.target }}
        run: |
          artifact_root="artifacts/benchmarks/${TARGET}"
          receipt="${artifact_root}/performance-attempt.json"
          python3 -m eng.performance.cli record-attempt \
            --artifact-root "${artifact_root}" \
            --report-directory "${artifact_root}/reports/${ATTEMPT_RUN_ID}" \
            --target "${TARGET}" \
            --profile "${ATTEMPT_PROFILE}" \
            --attempt 1 \
            --run-id "${ATTEMPT_RUN_ID}" \
            --commit "${ATTEMPT_COMMIT}" \
            --source-hash "${ATTEMPT_SOURCE_HASH}" \
            --runner-class github-ubuntu-latest-x64 \
            --exit-code "${ATTEMPT_EXIT_CODE}" \
            --comparison-mode "${ATTEMPT_COMPARISON_MODE}" \
            --output "${receipt}"
          python3 -m eng.performance.cli attempt-outputs \
            --receipt "${receipt}" >> "${GITHUB_OUTPUT}"

      - name: Upload attempt 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-attempt-${{ inputs.target }}-1
          path: artifacts/benchmarks/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 7

      # Raw samples remain short-lived. The small observation is retained so
      # the selector can bind both fresh-runner attempts into the explicit
      # fleet-drift confirmation required by D-026.
      - name: Report attempt 1 dispersion
        env:
          OBSERVATION: artifacts/benchmarks/${{ inputs.target }}/reports/${{ steps.identity.outputs.run-id }}/paired-dispersion-observation.json
          TARGET: ${{ inputs.target }}
        run: |
          if [[ ! -f "${OBSERVATION}" ]]; then
            exit 0
          fi
          state="$(jq -er '.state' "${OBSERVATION}")"
          realized="$(jq -er '.realizedLogRatioStandardDeviation' "${OBSERVATION}")"
          bound="$(jq -er '.registeredUpperBound' "${OBSERVATION}")"
          echo "- ${TARGET} attempt 1 dispersion: ${realized} (${state}; bound ${bound})" \
            >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${state}" == "drift" ]]; then
            echo "::warning title=Benchmark dispersion drift::${TARGET} attempt 1 exceeded the registered dispersion bound."
          fi

      - name: Retain attempt 1 dispersion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-dispersion-${{ inputs.target }}-1
          path: artifacts/benchmarks/${{ inputs.target }}/reports/${{ steps.identity.outputs.run-id }}/paired-dispersion-observation.json
          if-no-files-found: ignore
          retention-days: 30

  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.retry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve immutable attempt identity
        id: identity
        env:
          COMPARISON_MODE: ${{ inputs.comparison_mode }}
          DISPATCH_PROFILE: scorecard
          TARGET: ${{ inputs.target }}
        run: |
          echo "run-id=github-${GITHUB_RUN_ID}-${TARGET}-attempt-2" >> "${GITHUB_OUTPUT}"
          source_hash="$(python3 -m eng.performance.cli source-hash --repo .)"
          echo "source-hash=${source_hash}" >> "${GITHUB_OUTPUT}"
          attempt_profile="$(
            python3 -m eng.performance.cli attempt-profile \
              --contract benchmarks/performance-contract.json \
              --profile "${DISPATCH_PROFILE}" \
              --comparison-mode "${COMPARISON_MODE}"
          )"
          echo "attempt-profile=${attempt_profile}" >> "${GITHUB_OUTPUT}"

      - name: Run scorecard attempt 2
        id: benchmark
        env:
          DOKA_BENCHMARK_PROFILE: scorecard
          DOKA_BENCHMARK_BASELINE_MODE: ${{ inputs.comparison_mode == 'historical' && 'seed' || 'compare' }}
          DOKA_BENCHMARK_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
          DOKA_BENCHMARK_TARGET: ${{ inputs.target }}
          DOKA_BENCHMARK_RUN_ID: ${{ steps.identity.outputs.run-id }}
          DOKA_BENCHMARK_COMMIT: ${{ github.sha }}
          DOKA_BENCHMARK_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
        run: |
          set +e
          bash ./eng/benchmark.sh --up-run-down
          exit_code=$?
          set -e
          echo "exit-code=${exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Record attempt 2
        id: receipt
        env:
          ATTEMPT_COMMIT: ${{ github.sha }}
          ATTEMPT_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          ATTEMPT_PROFILE: ${{ steps.identity.outputs.attempt-profile }}
          ATTEMPT_EXIT_CODE: ${{ steps.benchmark.outputs.exit-code }}
          ATTEMPT_RUN_ID: ${{ steps.identity.outputs.run-id }}
          ATTEMPT_SOURCE_HASH: ${{ steps.identity.outputs.source-hash }}
          TARGET: ${{ inputs.target }}
        run: |
          artifact_root="artifacts/benchmarks/${TARGET}"
          receipt="${artifact_root}/performance-attempt.json"
          python3 -m eng.performance.cli record-attempt \
            --artifact-root "${artifact_root}" \
            --report-directory "${artifact_root}/reports/${ATTEMPT_RUN_ID}" \
            --target "${TARGET}" \
            --profile "${ATTEMPT_PROFILE}" \
            --attempt 2 \
            --run-id "${ATTEMPT_RUN_ID}" \
            --commit "${ATTEMPT_COMMIT}" \
            --source-hash "${ATTEMPT_SOURCE_HASH}" \
            --runner-class github-ubuntu-latest-x64 \
            --exit-code "${ATTEMPT_EXIT_CODE}" \
            --comparison-mode "${ATTEMPT_COMPARISON_MODE}" \
            --output "${receipt}"
          python3 -m eng.performance.cli attempt-outputs \
            --receipt "${receipt}" >> "${GITHUB_OUTPUT}"

      - name: Upload attempt 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-attempt-${{ inputs.target }}-2
          path: artifacts/benchmarks/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 7

      - name: Report attempt 2 dispersion
        env:
          OBSERVATION: artifacts/benchmarks/${{ inputs.target }}/reports/${{ steps.identity.outputs.run-id }}/paired-dispersion-observation.json
          TARGET: ${{ inputs.target }}
        run: |
          if [[ ! -f "${OBSERVATION}" ]]; then
            exit 0
          fi
          state="$(jq -er '.state' "${OBSERVATION}")"
          realized="$(jq -er '.realizedLogRatioStandardDeviation' "${OBSERVATION}")"
          bound="$(jq -er '.registeredUpperBound' "${OBSERVATION}")"
          echo "- ${TARGET} attempt 2 dispersion: ${realized} (${state}; bound ${bound})" \
            >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${state}" == "drift" ]]; then
            echo "::warning title=Benchmark dispersion drift::${TARGET} attempt 2 exceeded the registered dispersion bound."
          fi

      - name: Retain attempt 2 dispersion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-dispersion-${{ inputs.target }}-2
          path: artifacts/benchmarks/${{ inputs.target }}/reports/${{ steps.identity.outputs.run-id }}/paired-dispersion-observation.json
          if-no-files-found: ignore
          retention-days: 30

  select:
    needs:
      - attempt-1
      - attempt-2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download attempt 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-attempt-${{ inputs.target }}-1
          path: artifacts/attempts/${{ inputs.target }}/attempt-1

      - name: Download attempt 2
        if: needs.attempt-2.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-attempt-${{ inputs.target }}-2
          path: artifacts/attempts/${{ inputs.target }}/attempt-2

      # GitHub provisions every hosted job on a fresh runner. Binding the two
      # attempt receipts and their canonical projections makes confirmed drift
      # independent of the monthly schedule and thirty-day artifact limit.
      - name: Record independent dispersion confirmation
        if: needs.attempt-2.result == 'success'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          confirmation="artifacts/dispersion-confirmation/${TARGET}/paired-dispersion-confirmation.json"
          python3 -m eng.performance.cli record-dispersion-confirmation \
            --receipt "artifacts/attempts/${TARGET}/attempt-1/performance-attempt.json" \
            --receipt "artifacts/attempts/${TARGET}/attempt-2/performance-attempt.json" \
            --output "${confirmation}"
          if [[ -f "${confirmation}" ]]; then
            state="$(jq -er '.state' "${confirmation}")"
            echo "- ${TARGET} independent dispersion: ${state}" \
              >> "${GITHUB_STEP_SUMMARY}"
            if [[ "${state}" == "confirmed-drift" ]]; then
              echo "::warning title=Benchmark dispersion confirmed::${TARGET} exceeded the registered dispersion bound on both independent runners."
            fi
          fi

      - name: Select conclusive evidence
        env:
          TARGET: ${{ inputs.target }}
        run: |
          receipts=(
            --receipt "artifacts/attempts/${TARGET}/attempt-1/performance-attempt.json"
          )
          if [[ -f "artifacts/attempts/${TARGET}/attempt-2/performance-attempt.json" ]]; then
            receipts+=(
              --receipt "artifacts/attempts/${TARGET}/attempt-2/performance-attempt.json"
            )
          fi
          python3 -m eng.performance.cli select-attempt \
            "${receipts[@]}" \
            --destination "artifacts/benchmarks/${TARGET}" \
            --output "artifacts/benchmarks/${TARGET}/performance-attempt-selection.json"

      - name: Retain independent dispersion confirmation
        if: always() && needs.attempt-2.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-dispersion-confirmation-${{ inputs.target }}
          path: artifacts/dispersion-confirmation/${{ inputs.target }}/paired-dispersion-confirmation.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload qualified evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-artifacts-${{ inputs.target }}
          path: artifacts/benchmarks/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 7
