name: nuget-publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      release_tag:
        description: Exact semantic release tag, for example v10.0.0-rc.1
        required: true
        type: string
      confirmation:
        description: Type "publish <release-tag>" to authorize publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-and-read-back:
    runs-on: ubuntu-latest
    # NuGet documents symbol validation as normally completing within 15
    # minutes, but directs publishers to investigate only after one hour. The
    # job budget preserves that bounded failure signal plus runtime readback.
    timeout-minutes: 90
    environment:
      name: nuget

    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write

    steps:
      # Publication runs from trusted main. The selected candidate is required
      # to identify this exact commit, so an older or side-branch artifact can
      # never acquire current publication authority.
      - name: Checkout trusted publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Keep the exact SDK check independent from setup-dotnet so a runner
      # image or resolver change fails before any publication credential exists.
      - name: Verify approved .NET SDK
        run: bash ./eng/verify-dotnet.sh

      - name: Validate manual publication request
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DOKA_RELEASE_TAG: ${{ inputs.release_tag }}
          DOKA_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_dir="${RUNNER_TEMP}/publication-evidence"
          mkdir -p "${evidence_dir}"

          if [[ ! "${DOKA_CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Candidate run ID must be a positive integer." >&2
            exit 1
          fi

          if [[ "${DOKA_CONFIRMATION}" != "publish ${DOKA_RELEASE_TAG}" ]]; then
            echo "Publication confirmation does not match the selected tag." >&2
            exit 1
          fi

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${DOKA_CANDIDATE_RUN_ID}" \
            > "${RUNNER_TEMP}/candidate-run.json"

          trusted_main_commit="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ ! "${trusted_main_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The current main commit returned by GitHub is invalid." >&2
            exit 1
          fi

          jq -n \
            --arg candidateRunId "${DOKA_CANDIDATE_RUN_ID}" \
            --arg releaseTag "${DOKA_RELEASE_TAG}" \
            --arg trustedMainCommit "${trusted_main_commit}" \
            '{
              candidateRunId: $candidateRunId,
              releaseTag: $releaseTag,
              trustedMainCommit: $trustedMainCommit
            }' > "${evidence_dir}/publication-request.json"
          cp "${RUNNER_TEMP}/candidate-run.json" "${evidence_dir}/candidate-run.json"
          echo "DOKA_TRUSTED_MAIN_COMMIT=${trusted_main_commit}" >> "${GITHUB_ENV}"

      - name: Download immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-candidate-artifacts
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Validate candidate source, workflow, and package identities
        id: candidate
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DOKA_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          run_attempt="$(
            jq -er \
              '.run_attempt | select(type == "number")' \
              "${RUNNER_TEMP}/candidate-run.json"
          )"
          candidate_root="${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}-${run_attempt}"
          evidence_dir="${RUNNER_TEMP}/publication-evidence"
          mkdir -p "${evidence_dir}"

          python3 eng/nuget_publication.py validate \
            --repo "${GITHUB_WORKSPACE}" \
            --root "${candidate_root}" \
            --run-metadata "${RUNNER_TEMP}/candidate-run.json" \
            --release-tag "${DOKA_RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --trusted-ref "refs/heads/main" \
            --trusted-commit "${DOKA_TRUSTED_MAIN_COMMIT}" \
            --output "${evidence_dir}/validated-candidate.json" \
            --github-output "${GITHUB_OUTPUT}"

          echo "candidate_root=${candidate_root}" >> "${GITHUB_OUTPUT}"
          echo "evidence_dir=${evidence_dir}" >> "${GITHUB_OUTPUT}"

      - name: Derive exact public symbol probes
        env:
          CANDIDATE_ROOT: ${{ steps.candidate.outputs.candidate_root }}
          EVIDENCE_DIR: ${{ steps.candidate.outputs.evidence_dir }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.release_version }}
        run: |
          dotnet run \
            --project eng/Doka.EntityFrameworkCore.MySql.NuGetSymbolReadback \
            --configuration Release \
            -- \
            --candidate-root "${CANDIDATE_ROOT}" \
            --version "${RELEASE_VERSION}" \
            --output "${EVIDENCE_DIR}/symbol-readback-manifest.json"

      - name: Verify hosted artifact attestations
        env:
          CANDIDATE_ROOT: ${{ steps.candidate.outputs.candidate_root }}
          DOKA_RELEASE_TAG: ${{ inputs.release_tag }}
          DOKA_SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          attestations=(
            "${CANDIDATE_ROOT}/release-candidate-evidence.json"
            "${CANDIDATE_ROOT}/release-candidate-evidence.sha256"
            "${CANDIDATE_ROOT}/packages/"*.nupkg
            "${CANDIDATE_ROOT}/packages/"*.snupkg
          )

          for artifact in "${attestations[@]}"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "Attested candidate artifact is missing: ${artifact}" >&2
              exit 1
            fi
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --signer-digest "${DOKA_SOURCE_COMMIT}" \
              --source-ref "refs/tags/${DOKA_RELEASE_TAG}" \
              --source-digest "${DOKA_SOURCE_COMMIT}" \
              --deny-self-hosted-runners
          done

      - name: Check existing NuGet.org package state
        id: preflight
        env:
          EVIDENCE_DIR: ${{ steps.candidate.outputs.evidence_dir }}
        run: |
          python3 eng/nuget_publication.py preflight \
            --receipt "${EVIDENCE_DIR}/validated-candidate.json" \
            --symbol-manifest "${EVIDENCE_DIR}/symbol-readback-manifest.json" \
            --output "${EVIDENCE_DIR}/publication-preflight.json" \
            --github-output "${GITHUB_OUTPUT}"

      # Request the one-hour key only after every local and hosted identity
      # check has passed. No long-lived NuGet credential exists in the repo.
      - name: Request short-lived NuGet.org key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish provider package
        if: steps.preflight.outputs.provider_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PROVIDER_PACKAGE: ${{ steps.candidate.outputs.provider_package }}
        run: |
          dotnet nuget push "${PROVIDER_PACKAGE}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --timeout 300

      # NuGet's symbol endpoint returns HTTP 409 while an earlier upload of the
      # same ID and version is still pending. Only symbol uploads may treat that
      # documented state as an idempotent retry; primary packages never do.
      - name: Publish provider symbols
        if: steps.preflight.outputs.provider_symbols_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PROVIDER_SYMBOLS: ${{ steps.candidate.outputs.provider_symbols }}
        run: |
          dotnet nuget push "${PROVIDER_SYMBOLS}" \
            --api-key "${NUGET_API_KEY}" \
            --symbol-api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --timeout 300

      - name: Publish spatial package
        if: steps.preflight.outputs.spatial_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SPATIAL_PACKAGE: ${{ steps.candidate.outputs.spatial_package }}
        run: |
          dotnet nuget push "${SPATIAL_PACKAGE}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --timeout 300

      - name: Publish spatial symbols
        if: steps.preflight.outputs.spatial_symbols_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SPATIAL_SYMBOLS: ${{ steps.candidate.outputs.spatial_symbols }}
        run: |
          dotnet nuget push "${SPATIAL_SYMBOLS}" \
            --api-key "${NUGET_API_KEY}" \
            --symbol-api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --timeout 300

      - name: Verify public package and symbol payloads
        env:
          EVIDENCE_DIR: ${{ steps.candidate.outputs.evidence_dir }}
        run: |
          python3 eng/nuget_publication.py readback \
            --receipt "${EVIDENCE_DIR}/validated-candidate.json" \
            --symbol-manifest "${EVIDENCE_DIR}/symbol-readback-manifest.json" \
            --output-dir "${EVIDENCE_DIR}/packages" \
            --output "${EVIDENCE_DIR}/nuget-publication-readback.json" \
            --timeout-seconds 3600

      - name: Verify fresh consumer restore and runtime
        env:
          EVIDENCE_DIR: ${{ steps.candidate.outputs.evidence_dir }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.release_version }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
          MYSQL84_IMAGE: ${{ steps.candidate.outputs.mysql84_image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash eng/test-nuget-readback.sh \
            "${RELEASE_VERSION}" \
            "${RELEASE_TAG}" \
            "${SOURCE_COMMIT}" \
            "${MYSQL84_IMAGE}" \
            "${EVIDENCE_DIR}"

      - name: Upload publication and readback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-publication-evidence-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/publication-evidence
          if-no-files-found: error
          retention-days: 90
