name: nuget-publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      release_tag:
        description: Exact semantic release tag, for example v10.0.0-rc.1
        required: true
        type: string
      confirmation:
        description: Type "publish <release-tag>" to authorize publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      actions: read
      attestations: read
      contents: read

    outputs:
      candidate_artifact_name: ${{ steps.request.outputs.candidate_artifact_name }}
      mysql84_image: ${{ steps.candidate.outputs.mysql84_image }}
      release_version: ${{ steps.candidate.outputs.release_version }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      validation_artifact_name: ${{ steps.names.outputs.validation_artifact_name }}

    steps:
      # Validation runs from trusted main. The selected candidate must identify
      # this exact commit, so an older or side-branch artifact cannot acquire
      # current publication authority.
      - name: Checkout trusted publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Keep the exact SDK check independent from setup-dotnet so a runner
      # image or resolver change fails before any publication boundary opens.
      - name: Verify approved .NET SDK
        run: bash ./eng/common/verify-dotnet.sh

      - name: Validate manual publication request
        id: request
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DOKA_CONFIRMATION: ${{ inputs.confirmation }}
          DOKA_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_dir="${RUNNER_TEMP}/publication-evidence"
          mkdir -p "${evidence_dir}"

          if [[ ! "${DOKA_CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Candidate run ID must be a positive integer." >&2
            exit 1
          fi

          if [[ "${DOKA_CONFIRMATION}" != "publish ${DOKA_RELEASE_TAG}" ]]; then
            echo "Publication confirmation does not match the selected tag." >&2
            exit 1
          fi

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${DOKA_CANDIDATE_RUN_ID}" \
            > "${evidence_dir}/candidate-run.json"

          candidate_run_attempt="$(
            jq -er \
              '.run_attempt | select(type == "number" and . > 0)' \
              "${evidence_dir}/candidate-run.json"
          )"
          candidate_artifact_name="release-candidate-artifacts-attempt-${candidate_run_attempt}"
          trusted_main_commit="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ ! "${trusted_main_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The current main commit returned by GitHub is invalid." >&2
            exit 1
          fi

          jq -n \
            --arg candidateRunId "${DOKA_CANDIDATE_RUN_ID}" \
            --arg releaseTag "${DOKA_RELEASE_TAG}" \
            --arg trustedMainCommit "${trusted_main_commit}" \
            '{
              candidateRunId: $candidateRunId,
              releaseTag: $releaseTag,
              trustedMainCommit: $trustedMainCommit
            }' > "${evidence_dir}/publication-request.json"

          echo "candidate_artifact_name=${candidate_artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "DOKA_TRUSTED_MAIN_COMMIT=${trusted_main_commit}" >> "${GITHUB_ENV}"

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.request.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Validate candidate source, workflow, and package identities
        id: candidate
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DOKA_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          candidate_root="${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}"
          evidence_dir="${RUNNER_TEMP}/publication-evidence"

          python3 -m eng.release.nuget validate \
            --repo "${GITHUB_WORKSPACE}" \
            --root "${candidate_root}" \
            --run-metadata "${evidence_dir}/candidate-run.json" \
            --release-tag "${DOKA_RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --trusted-ref "refs/heads/main" \
            --trusted-commit "${DOKA_TRUSTED_MAIN_COMMIT}" \
            --output "${evidence_dir}/validated-candidate.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Derive exact public symbol probes
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.release_version }}
        run: |
          dotnet run \
            --project eng/tools/Doka.EntityFrameworkCore.MySql.NuGetSymbolReadback \
            --configuration Release \
            -- \
            --candidate-root \
              "${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}" \
            --version "${RELEASE_VERSION}" \
            --output \
              "${RUNNER_TEMP}/publication-evidence/symbol-readback-manifest.json"

      - name: Verify hosted artifact attestations
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DOKA_RELEASE_TAG: ${{ inputs.release_tag }}
          DOKA_SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_root="${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}"
          attestations=(
            "${candidate_root}/release-candidate-evidence.json"
            "${candidate_root}/release-candidate-evidence.sha256"
            "${candidate_root}/packages/"*.nupkg
            "${candidate_root}/packages/"*.snupkg
          )

          for artifact in "${attestations[@]}"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "Attested candidate artifact is missing: ${artifact}" >&2
              exit 1
            fi
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow \
                "${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --signer-digest "${DOKA_SOURCE_COMMIT}" \
              --source-ref "refs/tags/${DOKA_RELEASE_TAG}" \
              --source-digest "${DOKA_SOURCE_COMMIT}" \
              --deny-self-hosted-runners
          done

      # This early remote-state check rejects immutable same-version conflicts
      # before the protected environment is entered. The publish job repeats
      # the check immediately before requesting its one-hour NuGet key.
      - name: Validate current NuGet.org package state
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_root="${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}"
          evidence_dir="${RUNNER_TEMP}/publication-evidence"

          python3 -m eng.release.nuget preflight \
            --receipt "${evidence_dir}/validated-candidate.json" \
            --candidate-root "${candidate_root}" \
            --symbol-manifest "${evidence_dir}/symbol-readback-manifest.json" \
            --output "${evidence_dir}/publication-preflight-validation.json"

      - name: Name immutable validation evidence
        id: names
        run: |
          echo \
            "validation_artifact_name=nuget-validation-evidence-attempt-${GITHUB_RUN_ATTEMPT}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload immutable validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.validation_artifact_name }}
          path: ${{ runner.temp }}/publication-evidence
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: nuget

    permissions:
      actions: read
      contents: read
      id-token: write

    outputs:
      publish_evidence_artifact_name: ${{ steps.names.outputs.publish_evidence_artifact_name }}

    steps:
      - name: Checkout trusted publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify approved .NET SDK
        run: bash ./eng/common/verify-dotnet.sh

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-candidate.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download immutable validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-candidate.outputs.validation_artifact_name }}
          path: ${{ runner.temp }}/publication-evidence

      # This is the authoritative preflight. A rerun observes matching partial
      # publication and publishes only absent payloads; conflicting immutable
      # bytes fail before an OIDC token is requested.
      - name: Check NuGet.org immediately before publication
        id: preflight
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_root="${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}"
          evidence_dir="${RUNNER_TEMP}/publication-evidence"

          python3 -m eng.release.nuget preflight \
            --receipt "${evidence_dir}/validated-candidate.json" \
            --candidate-root "${candidate_root}" \
            --symbol-manifest "${evidence_dir}/symbol-readback-manifest.json" \
            --output "${evidence_dir}/publication-preflight.json" \
            --github-output "${GITHUB_OUTPUT}"

      # NuGet's trusted-publishing key is valid for one hour. It is requested
      # only when bytes remain absent and immediately before the bounded push
      # steps, not before candidate validation or public readback.
      - name: Request short-lived NuGet.org key
        if: steps.preflight.outputs.publication_required == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish provider package
        if: steps.preflight.outputs.provider_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PROVIDER_PACKAGE: ${{ steps.preflight.outputs.provider_package }}
        run: |
          dotnet nuget push "${PROVIDER_PACKAGE}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --timeout 300

      # NuGet's symbol endpoint returns HTTP 409 while an earlier upload of the
      # same ID and version is pending. Only symbol uploads treat that state as
      # an idempotent retry; primary packages never skip immutable conflicts.
      - name: Publish provider symbols
        if: steps.preflight.outputs.provider_symbols_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PROVIDER_SYMBOLS: ${{ steps.preflight.outputs.provider_symbols }}
        run: |
          dotnet nuget push "${PROVIDER_SYMBOLS}" \
            --api-key "${NUGET_API_KEY}" \
            --symbol-api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --timeout 300

      - name: Publish spatial package
        if: steps.preflight.outputs.spatial_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SPATIAL_PACKAGE: ${{ steps.preflight.outputs.spatial_package }}
        run: |
          dotnet nuget push "${SPATIAL_PACKAGE}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --timeout 300

      - name: Publish spatial symbols
        if: steps.preflight.outputs.spatial_symbols_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SPATIAL_SYMBOLS: ${{ steps.preflight.outputs.spatial_symbols }}
        run: |
          dotnet nuget push "${SPATIAL_SYMBOLS}" \
            --api-key "${NUGET_API_KEY}" \
            --symbol-api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --timeout 300

      - name: Name publication evidence
        if: always()
        id: names
        run: |
          echo \
            "publish_evidence_artifact_name=nuget-publish-evidence-attempt-${GITHUB_RUN_ATTEMPT}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload publication-boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.publish_evidence_artifact_name }}
          path: ${{ runner.temp }}/publication-evidence/publication-preflight.json
          if-no-files-found: error
          retention-days: 90

  readback:
    needs:
      - validate-candidate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 75

    permissions:
      actions: read
      contents: read

    outputs:
      readback_evidence_artifact_name: ${{ steps.names.outputs.readback_evidence_artifact_name }}

    steps:
      - name: Checkout trusted readback tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify approved .NET SDK
        run: bash ./eng/common/verify-dotnet.sh

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-candidate.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download immutable validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-candidate.outputs.validation_artifact_name }}
          path: ${{ runner.temp }}/publication-evidence

      - name: Download publication-boundary evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.publish.outputs.publish_evidence_artifact_name }}
          path: ${{ runner.temp }}/publication-evidence

      # NuGet documents symbol validation as normally completing within 15
      # minutes and directs publishers to investigate only after one hour.
      # The bounded wait covers indexing without retaining publish authority.
      - name: Verify public package and symbol payloads
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_root="${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}"
          evidence_dir="${RUNNER_TEMP}/publication-evidence"

          python3 -m eng.release.nuget readback \
            --receipt "${evidence_dir}/validated-candidate.json" \
            --candidate-root "${candidate_root}" \
            --symbol-manifest "${evidence_dir}/symbol-readback-manifest.json" \
            --output-dir "${evidence_dir}/packages" \
            --output "${evidence_dir}/nuget-publication-readback.json" \
            --timeout-seconds 3600

      - name: Verify fresh consumer restore and runtime
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/publication-evidence
          MYSQL84_IMAGE: ${{ needs.validate-candidate.outputs.mysql84_image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate-candidate.outputs.release_version }}
          SOURCE_COMMIT: ${{ needs.validate-candidate.outputs.source_commit }}
        run: |
          bash eng/testing/test-nuget-readback.sh \
            "${RELEASE_VERSION}" \
            "${RELEASE_TAG}" \
            "${SOURCE_COMMIT}" \
            "${MYSQL84_IMAGE}" \
            "${EVIDENCE_DIR}"

      - name: Name complete readback evidence
        if: always()
        id: names
        run: |
          echo \
            "readback_evidence_artifact_name=nuget-readback-evidence-attempt-${GITHUB_RUN_ATTEMPT}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload complete publication and readback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.readback_evidence_artifact_name }}
          path: ${{ runner.temp }}/publication-evidence
          if-no-files-found: error
          retention-days: 90

  # Repository write authority is outside the NuGet credential boundary and
  # cannot open until package, symbol, restore, and runtime readback succeed.
  finalize-github-release:
    needs:
      - validate-candidate
      - readback
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout trusted release tooling and annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-candidate.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download complete NuGet publication evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.readback.outputs.readback_evidence_artifact_name }}
          path: ${{ runner.temp }}/publication-evidence

      - name: Prepare deterministic GitHub release plan
        env:
          DOKA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_root="${RUNNER_TEMP}/candidate/github-${DOKA_CANDIDATE_RUN_ID}"

          python3 -m eng.release.github prepare \
            --repository "${GITHUB_REPOSITORY}" \
            --candidate-root "${candidate_root}" \
            --publication-evidence "${RUNNER_TEMP}/publication-evidence" \
            --changelog "${GITHUB_WORKSPACE}/CHANGELOG.md" \
            --output "${RUNNER_TEMP}/github-release-plan.json"

      # The helper verifies the local and remote annotated tag before creating
      # a draft. Matching drafts resume without replacing assets; every asset
      # is downloaded and hashed before the draft is published.
      - name: Publish and read back immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m eng.release.github publish \
            --repo "${GITHUB_WORKSPACE}" \
            --plan "${RUNNER_TEMP}/github-release-plan.json" \
            --output "${RUNNER_TEMP}/github-release-readback.json"

      - name: Upload GitHub release finalization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-evidence-${{ inputs.release_tag }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-release-plan.json
            ${{ runner.temp }}/github-release-readback.json
          if-no-files-found: error
          retention-days: 90
