name: dependency-review

# Reviews the dependency delta of a pull request before it can merge. The
# repository already audits resolved packages in the quality gate and receives
# Dependabot alerts after the fact; this closes the remaining window in which a
# newly introduced vulnerable or non-permissive package is invisible until it
# has already landed on main.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Every pushed main SHA can remain the base of an open pull request and must
  # therefore retain its own snapshot. Only superseded PR-head runs may cancel.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  dependency-submission:
    # Fork and Dependabot pull requests intentionally retain their read-only
    # token. Never move this job to pull_request_target or give untrusted code
    # a token that can write dependency-graph state for the base repository.
    if: >-
      github.event_name == 'push'
      || (
        github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.snapshot_mode.outputs.mode }}

    steps:
      # pull_request normally checks out a synthetic merge commit. Select the
      # exact PR head there and the pushed main commit otherwise, so both sides
      # of a future dependency comparison use the same restore-graph contract.
      - name: Checkout snapshot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha
            || github.sha }}
          persist-credentials: false

      # The first pull request cannot compare a repository-owned head snapshot
      # with an equivalent base snapshot because the base workflow predates
      # this job. Resolve that one-time bootstrap from the exact base revision;
      # after merge the structural marker makes the mode permanently canonical.
      - name: Resolve dependency snapshot mode
        id: snapshot_mode
        env:
          DOKA_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          DOKA_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m eng.quality.dependency_snapshot_readiness resolve-mode \
            --event-name "${DOKA_EVENT_NAME}" \
            --base-revision "${DOKA_BASE_REVISION}" \
            --api-url "${GITHUB_API_URL}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output artifacts/dependency-snapshot-mode.json
          echo "mode=$(jq -er '.mode' artifacts/dependency-snapshot-mode.json)" \
            >> "${GITHUB_OUTPUT}"

      - name: Setup .NET
        if: >-
          github.event_name == 'push'
          || steps.snapshot_mode.outputs.mode == 'canonical'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The restore uses the reviewed SDK and package policy. The repository-
      # owned converter consumes its resolved project.assets.json files, so the
      # snapshot cannot drift through a detector downloaded at workflow time.
      - name: Resolve canonical snapshot dependencies
        if: >-
          github.event_name == 'push'
          || steps.snapshot_mode.outputs.mode == 'canonical'
        run: bash eng/quality/restore-dependency-snapshot.sh

      - name: Submit canonical dependency snapshot
        if: >-
          github.event_name == 'push'
          || steps.snapshot_mode.outputs.mode == 'canonical'
        env:
          DOKA_SNAPSHOT_REF: >-
            ${{ github.event_name == 'pull_request'
            && format('refs/heads/{0}', github.event.pull_request.head.ref)
            || github.ref }}
          DOKA_SNAPSHOT_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha
            || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m eng.quality.dependency_snapshot \
            --repo-root . \
            --assets-root artifacts/obj \
            --sha "${DOKA_SNAPSHOT_SHA}" \
            --ref "${DOKA_SNAPSHOT_REF}" \
            --correlator "dependency-review-nuget" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --api-url "${GITHUB_API_URL}" \
            --output artifacts/dependency-snapshot.json \
            --submit

  dependency-review:
    needs: dependency-submission
    # A skipped producer is the expected untrusted-PR boundary; a failed
    # trusted submission is converted into a hard failure below.
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    permissions:
      checks: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require internal dependency snapshot
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && needs.dependency-submission.result != 'success'
        run: |
          echo "::error title=Dependency snapshot unavailable::The pull-request head snapshot was not submitted successfully."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The official action treats an expired snapshot-warning retry as a
      # usable comparison. Canonical mode is stricter: bind the exact base SHA
      # to its successful submission check and reject any remaining warning.
      - name: Require symmetric canonical dependency snapshots
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && needs.dependency-submission.outputs.mode == 'canonical'
        env:
          DOKA_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          DOKA_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m eng.quality.dependency_snapshot_readiness verify \
            --base-revision "${DOKA_BASE_REVISION}" \
            --head-revision "${DOKA_HEAD_REVISION}" \
            --api-url "${GITHUB_API_URL}" \
            --repository "${GITHUB_REPOSITORY}" \
            --wait-seconds 120 \
            --output artifacts/dependency-snapshot-readiness.json

      # The license set mirrors the repository dependency policy. Packages
      # whose license metadata is absent are reported separately rather than
      # blocked, so a missing SPDX field cannot masquerade as a policy breach.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MIT-0,
            Unlicense
          comment-summary-in-pr: never
          # Only the structurally one-time bootstrap omits per-dependency
          # Scorecards. Normal internal, fork, and Dependabot reviews retain
          # the OpenSSF signal; the separate repository Scorecard is not a
          # substitute for it.
          show-openssf-scorecard: >-
            ${{ needs.dependency-submission.outputs.mode != 'bootstrap' }}
          # Canonical mode already failed closed on snapshot warnings above.
          # Bootstrap and untrusted PRs intentionally retain the action default
          # instead of turning an incomplete comparison into a soft retry.
          retry-on-snapshot-warnings: false
