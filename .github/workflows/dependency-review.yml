name: dependency-review

# Reviews the dependency delta of a pull request before it can merge. GitHub's
# Automatic Dependency Submission owns the resolved NuGet graph; this workflow
# waits for its exact base/head comparison instead of submitting a second,
# competing snapshot for the same revision.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # A newer revision supersedes the dependency verdict for the same pull
  # request. Automatic submissions remain independent and are not cancelled.
  cancel-in-progress: true

jobs:
  dependency-review:
    permissions:
      checks: read
      contents: read
    runs-on: ubuntu-latest
    # Five producer minutes, fifteen propagation minutes, three action-retry
    # minutes, and two possible 30-second API overruns leave six runner minutes.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub recommends ordering dependency submission before review. Its
      # automatic producer is a separate dynamic workflow, so bind both exact
      # SHA check receipts first and only then start graph-propagation retries.
      - name: Require complete automatic dependency snapshots
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          DOKA_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          DOKA_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m eng.quality.dependency_snapshot_readiness verify \
            --base-revision "${DOKA_BASE_REVISION}" \
            --head-revision "${DOKA_HEAD_REVISION}" \
            --api-url "${GITHUB_API_URL}" \
            --repository "${GITHUB_REPOSITORY}" \
            --producer-wait-seconds 300 \
            --propagation-wait-seconds 900 \
            --output artifacts/dependency-snapshot-readiness.json

      - name: Summarize automatic dependency readiness
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          {
            echo "## Dependency snapshot readiness"
            echo
            jq -r '"- Base producer check: \(.automaticSubmission.base.checkId)"' \
              artifacts/dependency-snapshot-readiness.json
            jq -r '"- Head producer check: \(.automaticSubmission.head.checkId)"' \
              artifacts/dependency-snapshot-readiness.json
            jq -r '"- Producer wait: \(.observedWaitSeconds.producer) seconds"' \
              artifacts/dependency-snapshot-readiness.json
            jq -r '"- Propagation wait: \(.observedWaitSeconds.propagation) seconds"' \
              artifacts/dependency-snapshot-readiness.json
          } >> "${GITHUB_STEP_SUMMARY}"

      # The license set mirrors the repository dependency policy. Packages
      # whose license metadata is absent are reported separately rather than
      # blocked, so a missing SPDX field cannot masquerade as a policy breach.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MIT-0,
            Unlicense
          comment-summary-in-pr: never
          show-openssf-scorecard: true
          # Trusted PRs normally arrive here after the stricter preflight.
          # Retain the official retry for untrusted PRs, where write-capable
          # head submission cannot be orchestrated by this workflow.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180
