name: dependency-review

# Reviews the dependency delta of a pull request before it can merge. The
# repository already audits resolved packages in the quality gate and receives
# Dependabot alerts after the fact; this closes the remaining window in which a
# newly introduced vulnerable or non-permissive package is invisible until it
# has already landed on main.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The license set mirrors the repository dependency policy. Packages
      # whose license metadata is absent are reported separately rather than
      # blocked, so a missing SPDX field cannot masquerade as a policy breach.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MIT-0,
            Unlicense
          comment-summary-in-pr: never
