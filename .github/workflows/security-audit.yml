name: dependency-security-audit
run-name: ${{ inputs.maintenance && format('maintenance {0}', inputs.schedule_correlation) || 'dependency-security-audit' }}
# release-line-schedule: {"schemaVersion":1,"producers":["dependency-vulnerability-audit"]}

on:
  workflow_dispatch:
    inputs:
      maintenance:
        description: Run this active branch's scheduled dependency security audit.
        type: boolean
        default: false
      expected_commit:
        description: Exact branch head resolved by the schedule coordinator.
        type: string
        default: ""
      schedule_correlation:
        description: Immutable coordinator run and attempt identity.
        type: string
        default: ""
  schedule:
    - cron: "35 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.maintenance && 'maintenance' || 'normal' }}
  cancel-in-progress: false

jobs:
  schedule-identity:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run_audit: ${{ steps.native.outputs.run_audit || steps.child.outputs.run_audit || steps.manual.outputs.run_audit }}
    steps:
      - name: Checkout branch-native security guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the currently active default line
        if: github.event_name == 'schedule'
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 eng/release/schedules.py validate-default --workflow security-audit.yml
          --github-output "${GITHUB_OUTPUT}"

      - name: Validate exact active maintenance producer
        if: inputs.maintenance
        id: child
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SCHEDULE_CORRELATION: ${{ inputs.schedule_correlation }}
        run: |
          python3 eng/release/schedules.py validate-child --workflow security-audit.yml \
            --expected-commit "${EXPECTED_COMMIT}" --correlation "${SCHEDULE_CORRELATION}"
          echo "run_audit=true" >> "${GITHUB_OUTPUT}"

      # WHY: A read-only manual check on a development branch grants no release authority.
      - name: Permit explicit nonpublishing security checks
        if: github.event_name == 'workflow_dispatch' && !inputs.maintenance
        id: manual
        run: echo "run_audit=true" >> "${GITHUB_OUTPUT}"

  scheduled-release-lines:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout schedule authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dispatch and await each active branch-native security audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 eng/release/schedules.py run --workflow security-audit.yml
          --output artifacts/release-lines/schedule-security-audit.json

      - name: Upload exact scheduled child evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-line-schedule-security-audit
          path: artifacts/release-lines/schedule-security-audit.json
          if-no-files-found: warn
          retention-days: 30

  dependency-vulnerability-audit:
    if: needs.schedule-identity.outputs.run_audit == 'true'
    needs: schedule-identity
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout the audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup the branch-owned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # WHY: Only package content is reused; advisory HTTP data is isolated and refreshed by the runner.
      - name: Cache NuGet package content
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Audit all direct and transitive project dependencies
        run: bash eng/quality/audit-dependencies.sh

      - name: Retain security findings and incomplete-audit diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-audit
          path: artifacts/security-audit
          if-no-files-found: warn
          retention-days: 30
