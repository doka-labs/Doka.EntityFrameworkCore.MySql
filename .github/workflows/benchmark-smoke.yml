name: benchmark-smoke

# This internal workflow exercises the complete active LTS target contract with
# the short, non-qualifying smoke profile. It has no dispatch trigger: CI owns
# scheduled early warning and the benchmark resolver owns provider-change
# validation. This workflow owns contract-derived fan-out and target lifecycle
# so a support-line change cannot leave a second matrix behind.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub supports feeding one job's JSON output into a downstream matrix.
      # Reading the versioned contract here keeps smoke target discovery on the
      # same source of truth as scorecard and release qualification.
      - name: Resolve required benchmark targets
        id: targets
        run: |
          targets="$(jq -cer '.requiredTargets | keys' benchmarks/performance-contract.json)"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  benchmark-target:
    needs: resolve-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-targets.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run benchmark smoke
        env:
          # Smoke is a single-revision absolute-contract probe, not a release
          # regression verdict. Keep both orchestration modes explicit so a
          # changed shell default cannot silently change that responsibility.
          DOKA_BENCHMARK_BASELINE_MODE: compare
          DOKA_BENCHMARK_COMPARISON_MODE: historical
          DOKA_BENCHMARK_PROFILE: smoke
          DOKA_BENCHMARK_RUNNER_CLASS: github-ubuntu-latest-x64
          DOKA_BENCHMARK_TARGET: ${{ matrix.target }}
        run: bash ./eng/benchmark.sh --up-run-down

      - name: Upload failed smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke-${{ matrix.target }}-${{ github.run_attempt }}
          path: artifacts/benchmarks/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 7
